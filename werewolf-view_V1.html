<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>狼人殺・場上資訊</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e3dfd6;--acc:#7a2e2e;--accbg:#f4e6e6;--ok:#2f6f4f;--okbg:#e4f1ea;--out:#9aa0a6;--gold:#b7791f;--goldbg:#fbf0d9}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--ink:#eceae4;--mut:#9aa0a6;--line:#30343a;--acc:#e08a8a;--accbg:#3a2424;--ok:#7bc79b;--okbg:#1f3328;--out:#6b7078;--gold:#e5b455;--goldbg:#3a2f18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
.tabs{display:flex;gap:8px;padding-top:14px}
.tabs button{flex:1;font-weight:700}
.tabs button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}

:root{--wolf:#c0453b;--wolfbg:#f9e4e1;--god:#2f6fb5;--godbg:#e1ecf8;--good:#2f7a52;--goodbg:#e2f1e8;--third:#7a55b8;--thirdbg:#ece4f8}
@media (prefers-color-scheme:dark){:root{--wolf:#ee8277;--wolfbg:#3d2522;--god:#7fb0ea;--godbg:#202d3e;--good:#7bc79b;--goodbg:#1f3328;--third:#b99be8;--thirdbg:#2d2640}}
.rchip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.84rem;font-weight:700;white-space:nowrap}
.c-wolf{background:var(--wolfbg);color:var(--wolf)}.c-god{background:var(--godbg);color:var(--god)}.c-good{background:var(--goodbg);color:var(--good)}.c-third{background:var(--thirdbg);color:var(--third)}
.c-conv{background:linear-gradient(90deg,var(--godbg) 0 50%,var(--wolfbg) 50% 100%);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rtag{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:99px;background:var(--line);color:var(--mut);margin:2px 4px 0 0;white-space:nowrap}
.rtag.sh{background:var(--goldbg);color:var(--gold);font-weight:700}.rtag.out{background:var(--accbg);color:var(--acc)}.rtag.cv{background:var(--wolfbg);color:var(--wolf)}
.rs{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rs:first-of-type{border-top:0}
.rno{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line)}
.rs.dead .rno{text-decoration:line-through;opacity:.6}.rs.dead .rnm{color:var(--mut)}
.rnm{font-weight:600}.rr{text-align:right}
.rrow{display:grid;grid-template-columns:116px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.rrow:first-of-type{border-top:0}
.ract b{font-weight:800}.ract small{color:var(--mut);margin-left:6px}
.rres{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rres.first{margin-top:0;padding-top:0;border-top:0}
.rres .lbl{color:var(--mut);font-size:.88rem;min-width:56px}
.rdot{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:800}
.ri{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.rdot.g{background:var(--line);color:var(--ink)}
.rv3{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rv3:first-of-type{border-top:0}
.rv3 .by{color:var(--mut);font-size:.9rem}.rv3 .n{font-weight:800;color:var(--acc)}
.rv3.top .n{background:var(--accbg);padding:1px 10px;border-radius:99px}
.rsec{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:.92rem}
.rsec.night{background:var(--godbg);color:var(--god)}.rsec.day{background:var(--goldbg);color:var(--gold)}
.rsec:first-of-type{margin-top:4px}
.shv{display:inline-block;padding:0 8px;border-radius:99px;background:var(--goldbg);color:var(--gold);font-weight:800;font-size:.86rem}
.rh3{margin:12px 0 6px;font-size:.95rem;font-weight:800}
pre.rv{white-space:pre-wrap;word-break:break-word;font:.92rem/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;margin:0}
header{padding:20px 0 8px}
h1{margin:0;font-size:1.35rem}
.sub{color:var(--mut);font-size:.9rem;margin-top:2px}
.stage{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
h2{margin:0 0 10px;font-size:1.05rem}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.seat{border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;background:var(--card);position:relative;min-height:62px}
.seat b{display:block;font-size:1.15rem}
.seat span{display:block;font-size:.8rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.out{background:transparent;color:var(--out);border-style:dashed}
.seat.out b{text-decoration:line-through}
.seat.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.tag{display:inline-block;font-size:.72rem;font-style:normal;padding:0 6px;border-radius:99px;margin-top:2px}
.tag.sh{background:var(--goldbg);color:var(--gold)}
.tag.cd{background:var(--okbg);color:var(--ok)}
.tag.ot{background:var(--line);color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:3px 10px;border-radius:99px;background:var(--line);font-size:.9rem}
.pill.sh{background:var(--goldbg);color:var(--gold);font-weight:700}
.vote{padding:10px 0;border-top:1px solid var(--line)}
.vote:first-of-type{border-top:0}
.vote .who{font-weight:700}
.vote .by{color:var(--mut);font-size:.92rem}
.vote .n{float:right;font-weight:800;color:var(--acc)}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.muted{color:var(--mut);font-size:.9rem}
.empty{color:var(--mut);padding:6px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:12px}
button[disabled]{opacity:.5}
.status{position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top));font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.status.off{background:var(--goldbg);color:var(--gold)}
.win{text-align:center;font-weight:800;font-size:1.3rem;padding:14px;border-radius:16px;background:var(--accbg);color:var(--acc);margin:14px 0}
</style>
</head>
<body>
<div class="status" id="st">連線中…</div>
<main id="app"><header><h1>🐺 狼人殺・場上資訊</h1><div class="sub">等待上帝開局…</div></header></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,onSnapshot,getDoc,collection,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
var app=initializeApp({
  apiKey:"AIzaSyDVWEnINOZf2bGuC7SxHm4_JOqJGq6AixQ",
  authDomain:"werewolf-game-soymilk.firebaseapp.com",
  projectId:"werewolf-game-soymilk",
  storageBucket:"werewolf-game-soymilk.firebasestorage.app",
  messagingSenderId:"267788587461",
  appId:"1:267788587461:web:6932c7ea6ee1c0b9813bac"
});
var db=getFirestore(app);
var WC=null,WD=null,WERR=null,WUNSUB=null,WCODE='';try{WCODE=localStorage.getItem('wwWatch')||'';}catch(e){}
var P=null,ME=null,ERR=null,LASTGAME=null,TAB='live',REV=[],REVERR=null,REVID=null;
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
try{ME=+localStorage.getItem('wwview.me')||null;}catch(e){}
function stageText(p){
  if(p.phase==='over')return '本局結束';
  if(p.phase==='setup'||!p.day)return '尚未開局';
  if(p.stage==='night')return '第 '+p.day+' 夜';
  if(p.stage==='sheriff')return '警長競選';
  if(p.stage==='dawn')return '天亮了';
  return '第 '+p.day+' 天・白天';
}
function nm(p,n){var x=p.names&&p.names[n];return x?esc(x):'';}
function isOut(p,n){return (p.out||[]).some(function(x){return x.seat===n;});}
function seatsHTML(p){
  var h='';
  for(var n=1;n<=p.players;n++){
    var out=isOut(p,n),tags='';
    if(p.sheriff===n)tags+='<i class="tag sh">警長</i> ';
    if((p.cand||[]).indexOf(n)>=0&&!out)tags+='<i class="tag cd">'+((p.withdrawn||[]).indexOf(n)>=0?'退水':'上警')+'</i> ';
    if(out)tags+='<i class="tag ot">出局</i>';
    h+='<div class="seat'+(out?' out':'')+(ME===n?' me':'')+'" data-seat="'+n+'"><b>'+n+'</b><span>'+nm(p,n)+'</span>'+tags+'</div>';
  }
  return h;
}
function voteBlock(p,key){
  var v=p.votes[key]||{},g={};
  Object.keys(v).forEach(function(m){(g[v[m]]=g[v[m]]||[]).push(+m);});
  var isD=key.charAt(0)==='D',tl=Object.keys(g).map(Number).filter(function(t){return t!==0;});
  var w=function(m){return (isD&&p.sheriff===m)?1.5:1;};
  var cnt=function(t){return g[t].reduce(function(s,m){return s+w(m);},0);};
  tl.sort(function(a,b){return cnt(b)-cnt(a)||a-b;});
  var h='';
  tl.forEach(function(t){
    h+='<div class="vote"><span class="n">'+cnt(t)+' 票</span><div class="who">'+t+' 號'+(nm(p,t)?' '+nm(p,t):'')+'</div><div class="by">'+g[t].map(function(m){return m+(w(m)>1?'(警1.5)':'');}).join('、')+'</div></div>';
  });
  if(g[0])h+='<div class="vote"><span class="n">'+g[0].length+' 人</span><div class="who">棄票</div><div class="by">'+g[0].join('、')+'</div></div>';
  var pe=p.pending&&p.pending[key];
  if(pe&&pe.length)h+='<div class="vote"><span class="n">?</span><div class="who">尚未記錄</div><div class="by">'+pe.join('、')+' 號（等待上帝輸入）</div></div>';
  return h||'<div class="empty">尚未記錄票型</div>';
}
function baseKey(k){return k==='S2'?'S':k.replace(/p$/,'');}
function isPk(k){return k==='S2'||/^D\d+p$/.test(k);}
function voteTitle(k){var b=baseKey(k);return (b==='S'?'警長投票':'第 '+b.slice(1)+' 天放逐投票')+(isPk(k)?'・PK 輪':((P&&P.pk&&P.pk[b])?'・第一輪':''));}
function keyRank(k){var b=baseKey(k),n=b==='S'?0:+b.slice(1);return n*10+(isPk(k)?5:0);}
function pkLine(p,k){var pk=isPk(k)&&p.pk&&p.pk[baseKey(k)];return pk?'<p class="muted" style="margin:2px 0 6px">PK 發言：'+pk.seq.join(' → ')+' 號（這一輪 '+pk.seats.join('、')+' 號不能投票）</p>':'';}
function pubWho(p,n){return '<span class="ri">'+rvDot(n)+'<b>號'+(nm(p,n)?'（'+nm(p,n)+'）':'')+'</b></span>';}
function pubBadge(p,b){return '<div class="rres"><span class="lbl">警徽</span>'+pubWho(p,b.from)+(b.lost?'<b>撕毀警徽</b>':'<b>→</b>'+pubWho(p,b.to))+'</div>';}
function pubDaysHTML(p){
  var h='<section class="card"><h2>出局名單</h2>';
  if(!p.days||!p.days.length)return h+'<div class="empty">還沒有人出局</div></section>';
  p.days.forEach(function(D){
    h+='<div class="rh3">第 '+D.d+' 天</div>';
    if(D.n){
      h+='<div class="rres first"><span class="lbl">夜晚</span>'+(D.n.out.length?D.n.out.map(function(n,i){return '<span class="ri">'+rvDot(n)+'<b>號'+(nm(p,n)?'（'+nm(p,n)+'）':'')+(i<D.n.out.length-1?'、':'')+'</b></span>';}).join('')+'<b>出局</b>':'<b>平安夜</b>')+'</div>';
    }
    D.badge.filter(function(b){return b.phase==='N';}).forEach(function(b){h+=pubBadge(p,b);});
    D.dd.forEach(function(x){h+='<div class="rres"><span class="lbl">白天</span>'+pubWho(p,x.seat)+'<b>'+(x.boom?'自爆淘汰':'淘汰')+'</b></div>';});
    D.badge.filter(function(b){return b.phase!=='N';}).forEach(function(b){h+=pubBadge(p,b);});
  });
  return h+'</section>';
}
function renderLive(app){
  if(!P){app.innerHTML='<header><h1>🐺 狼人殺・場上資訊</h1><div class="sub">'+(ERR?esc(ERR):'等待上帝開局…')+'</div></header>';return;}
  if(P.phase==='setup'){app.innerHTML='<header><h1>🐺 狼人殺・場上資訊</h1><div class="sub">等待上帝開局…</div></header>';return;}
  var p=P,h='<header><h1>🐺 '+(esc(p.boardName)||'狼人殺')+'</h1><div class="sub">'+p.players+' 人局・只顯示白天公開資訊</div><span class="stage">'+stageText(p)+'</span></header>';
  if(p.phase==='over'&&p.winner)h+='<div class="win">'+({good:'好人陣營勝利',wolf:'狼人陣營勝利',third:'第三方勝利'}[p.winner]||'本局結束')+'</div>';
  h+='<section class="card"><h2>座位'+(ME?'（你是 '+ME+' 號）':'')+'</h2><div class="seats">'+seatsHTML(p)+'</div>'+
     '<p class="muted" style="margin:10px 0 0">'+(ME?'再點一下自己的座位可取消標記。':'點選你的座位，之後可快速辨識（只存在這支手機上）。')+'</p></section>';
  if(p.sheriff!=null||p.badgeLost||(p.cand||[]).length){
    h+='<section class="card"><h2>警長</h2><div class="row">';
    h+=p.sheriff!=null?'<span class="pill sh">警長 '+p.sheriff+' 號</span>':(p.badgeLost?'<span class="pill">警徽遺失</span>':'<span class="pill">尚未選出</span>');
    h+='</div>';
    if(p.uncontested&&p.sheriff!=null)h+='<p class="muted" style="margin:10px 0 0">同額競選，直接當選。</p>';
    if((p.cand||[]).length)h+='<p class="muted" style="margin:10px 0 0">上警：'+p.cand.map(function(n){return n+((p.withdrawn||[]).indexOf(n)>=0?'(退水)':'');}).join('、')+' 號</p>';
    h+='</section>';
  }
  var keys=Object.keys(p.votes||{}).filter(function(k){return Object.keys(p.votes[k]).length;});
  keys.sort(function(a,b){return keyRank(b)-keyRank(a);});
  h+='<section class="card"><h2>投票票型</h2>';
  if(!keys.length)h+='<div class="empty">目前還沒有票型紀錄</div>';
  keys.forEach(function(k,i){
    h+=(i===0?'<div><div class="who" style="font-weight:800;margin:4px 0">'+voteTitle(k)+'</div>'+pkLine(p,k)+voteBlock(p,k)+'</div>':'<details><summary>'+voteTitle(k)+'</summary>'+pkLine(p,k)+voteBlock(p,k)+'</details>');
  });
  h+='</section>';
  if(p.days){h+=pubDaysHTML(p);}else{
  var outs=(p.out||[]).slice().sort(function(a,b){return a.day-b.day||(a.phase==='N'?-1:1);});
  h+='<section class="card"><h2>出局名單</h2>'+(outs.length?'<div class="row">'+outs.map(function(x){return '<span class="pill">'+x.seat+' 號・第'+x.day+(x.phase==='N'?'夜':'天')+'</span>';}).join('')+'</div>':'<div class="empty">還沒有人出局</div>')+'</section>';}
  h+='<section class="card"><h2>連線投票</h2><button disabled>連線投票（待開發）</button><p class="muted" style="margin:8px 0 0">目前由上帝記錄票型，這裡只顯示結果。</p></section>';
  app.innerHTML=h;
}
document.addEventListener('click',function(e){
  var s=e.target.closest&&e.target.closest('.seat');if(!s)return;
  var n=+s.getAttribute('data-seat');ME=(ME===n)?null:n;
  try{if(ME)localStorage.setItem('wwview.me',ME);else localStorage.removeItem('wwview.me');}catch(x){}
  render();
});
function fmtD(iso){var d=new Date(iso);if(isNaN(d))return '';return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function dayBlocks(text){
  var lines=String(text||'').split('\n'),blocks=[],cur={title:'',lines:[]};
  lines.forEach(function(l){
    if(/^第.+天$/.test(l)){blocks.push(cur);cur={title:l,lines:[]};}else cur.lines.push(l);
  });
  blocks.push(cur);return blocks;
}

var CNR=['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
var CAUSE={'開槍':'被開槍帶走','自爆':'自爆','殉情':'殉情','連帶':'連帶出局','騎士驗中':'被騎士驗中','騎士自盡':'騎士自盡','夢殺':'被夢殺','黑市':'出局'};
function rvDot(n,cls){return '<span class="rdot'+(cls?' '+cls:'')+'">'+n+'</span>';}
function rvNm(R,n){var s=R.seats.filter(function(x){return x.n===n;})[0];return s&&s.name?'（'+esc(s.name)+'）':'';}
function rvOutLine(R,lbl,list,phase){
  if(!list||!list.length)return '';
  var groups={},order=[];
  list.forEach(function(x){var t=(phase==='D'&&x.cause==='自爆')?'自爆淘汰':(CAUSE[x.cause]||(phase==='N'?'被殺死':'淘汰'));if(!groups[t]){groups[t]=[];order.push(t);}groups[t].push(x.seat);});
  return order.map(function(t,i){return '<div class="rres"><span class="lbl">'+(i===0?lbl:'')+'</span>'+groups[t].map(function(n,j){return '<span class="ri">'+rvDot(n)+'<b>號'+rvNm(R,n)+(j<groups[t].length-1?'、':'')+'</b></span>';}).join('')+'<b>'+t+'</b></div>';}).join('');
}
function rvBadge(R,b){return '<div class="rres"><span class="lbl">警徽</span><span class="ri">'+rvDot(b.from)+'<b>號'+rvNm(R,b.from)+'</b></span>'+(b.lost?'<b>撕毀警徽</b>':'<b>→</b><span class="ri">'+rvDot(b.to)+'<b>號'+rvNm(R,b.to)+'</b></span>')+'</div>';}
function rvVoteHTML(R,v){
  var h='<div class="rh3">'+esc(v.title)+'</div>';
  if(v.pk)h+='<p class="muted" style="margin:0 0 6px">PK 發言：'+v.pk.seq.map(function(n){return rvDot(n);}).join(' → ')+'　（'+v.pk.seats.join('、')+' 號平票，不能投票）</p>';
  v.rows.forEach(function(r,i){
    h+='<div class="rv3'+(i===0?' top':'')+'">'+rvDot(r.t)+'<span class="by">'+r.by.map(function(m){return m===r.shv?'<span class="shv">'+m+' 警長 1.5</span>':m;}).join('、')+'</span><span class="n">'+r.cnt+' 票</span></div>';
  });
  if(v.abst&&v.abst.length)h+='<div class="rv3"><span class="rdot g">棄</span><span class="by">'+v.abst.join('、')+'</span><span class="n">'+v.abst.length+' 人</span></div>';
  return h;
}
function rvPage(g,R,o){
  o=o||{};
  var w={good:'好人陣營勝利',wolf:'狼人陣營勝利',third:'第三方勝利'}[g.winner]||(o.noBack?'進行中':'本局結束');
  var wc={good:'good',wolf:'wolf',third:'third'}[g.winner]||'good';
  var h='<header><h1>'+(g.no!=null?'第 '+g.no+' 局　':'')+esc(g.boardName||'賽後回顧')+'</h1><div class="sub">'+fmtD(g.created)+'・'+g.players+' 人・共 '+R.days.length+' 天</div><div class="win" style="background:var(--'+wc+'bg);color:var(--'+wc+')">'+esc(w)+'</div></header>'+(o.noBack?'<div class="row" style="margin:8px 0"><button data-wleave="1">離開觀戰</button></div>':'<div class="row" style="margin:8px 0"><button data-back="1">← 返回過往</button></div>')+'';
  h+='<section class="card"><h2>座位與身分</h2>'+R.seats.map(function(x){
    var tags='';
    if(x.sheriff)tags+='<span class="rtag sh">警長</span>';
    if(x.cand)tags+='<span class="rtag">上警</span>';
    if(x.wd)tags+='<span class="rtag">退水</span>';
    if(x.conv)tags+='<span class="rtag cv">第'+(CNR[x.cvDay]||x.cvDay)+'夜被轉化</span>';
    if(x.out)tags+='<span class="rtag out">第'+(CNR[x.out.day]||x.out.day)+(x.out.phase==='N'?'夜':'天')+(CAUSE[x.out.cause]||(x.out.phase==='N'?'出局':'放逐'))+'</span>';
    return '<div class="rs'+(x.out?' dead':'')+'"><span class="rno">'+x.n+'</span><div><div class="rnm">'+(esc(x.name)||'&nbsp;')+'</div>'+(tags?'<div>'+tags+'</div>':'')+'</div><div class="rr"><span class="rchip '+(x.conv?'c-conv':'c-'+x.cls)+'">'+esc(x.role)+(x.conv?' → 狼人':'')+'</span></div></div>';
  }).join('')+'</section>';
  var S=R.sh;
  if(S){
    h+='<section class="card"><h2>警長競選</h2>';
    h+='<div class="rres first"><span class="lbl">上警</span>'+(S.cand.length?S.cand.map(function(n){return rvDot(n,'g');}).join(''):'無')+'</div>';
    if(S.wd&&S.wd.length)h+='<div class="rres"><span class="lbl">退水</span>'+S.wd.map(function(n){return rvDot(n,'g');}).join('')+'</div>';
    if(S.extras&&S.extras.length)h+='<div class="rres"><span class="lbl">加時</span>'+S.extras.map(function(n){return rvDot(n,'g');}).join('')+'</div>';
    if(S.booms)h+='<div class="rres"><span class="lbl">自爆</span><b>'+S.booms+' 次</b></div>';
    if(S.uncontested)h+='<div class="rres"><span class="lbl">投票</span><b>同額競選，不需投票，直接當選</b></div>';
    (S.votes||[]).forEach(function(v){h+=rvVoteHTML(R,v);});
    h+='<div class="rres"><span class="lbl">結果</span>'+(S.sheriff!=null?'<span class="rchip" style="background:var(--goldbg);color:var(--gold)">'+S.sheriff+' 號'+rvNm(R,S.sheriff).replace(/[（）]/g,function(c){return c==='（'?' ':'';})+' 當選警長</span>':(S.badgeLost?'警徽遺失':'未選出'))+'</div></section>';
  }
  R.days.forEach(function(D){
    h+='<section class="card"><h2>第'+(CNR[D.d]||D.d)+'天</h2><div class="rsec night">🌙 夜間行動</div>';
    if(D.night.length)h+=D.night.map(function(x){return '<div class="rrow"><span class="rchip c-'+x.cls+'" style="justify-self:start">'+esc(String(x.role).replace(/（.*）/,''))+'</span><div class="ract"><b>'+esc(x.act)+'</b>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</div></div>';}).join('');
    else h+='<div class="empty">沒有記錄夜間行動</div>';
    if(D.nOut&&D.nOut.length)h+=rvOutLine(R,'夜晚',D.nOut,'N');
    else if(D.peace)h+='<div class="rres"><span class="lbl">夜晚</span><b>平安夜</b></div>';
    (D.badge||[]).filter(function(b){return b.phase==='N';}).forEach(function(b){h+=rvBadge(R,b);});
    h+='<div class="rsec day">☀️ 白天</div>';
    if(D.extras&&D.extras.length)h+='<div class="rres first"><span class="lbl">加時</span>'+D.extras.map(function(n){return rvDot(n,'g');}).join('')+'</div>';
    (D.votes||[]).forEach(function(v){h+=rvVoteHTML(R,v);});
    if(D.idiot!=null)h+='<div class="rres"><span class="lbl">白天</span>'+'<span class="ri">'+rvDot(D.idiot)+'<b>號'+rvNm(R,D.idiot)+'</b></span><b>翻牌・免死</b></div>';
    h+=rvOutLine(R,'白天',D.dOut,'D');
    (D.badge||[]).filter(function(b){return b.phase!=='N';}).forEach(function(b){h+=rvBadge(R,b);});
    if(!(D.extras&&D.extras.length)&&!(D.votes&&D.votes.length)&&D.idiot==null&&!(D.dOut&&D.dOut.length)&&!(D.badge&&D.badge.some(function(b){return b.phase!=='N';})))h+='<div class="empty">沒有白天記錄</div>';
    h+='</section>';
  });
  return h;
}
function renderPast(app){
  if(REVID!=null){
    var g=REV.filter(function(x){return x.id===REVID;})[0];
    if(g){
      var w={good:'好人陣營勝利',wolf:'狼人陣營勝利',third:'第三方勝利'}[g.winner]||'本局結束';
      var h='<header><h1>'+(g.no!=null?'第 '+g.no+' 局　':'')+esc(g.boardName||'賽後回顧')+'</h1><div class="sub">'+fmtD(g.created)+'・'+g.players+' 人</div><span class="stage">'+esc(w)+'</span></header><div class="row" style="margin:8px 0"><button data-back="1">← 返回過往</button></div>';
      if(g.rv&&g.rv.v===1){try{app.innerHTML=rvPage(g,g.rv);return;}catch(e){}}
      dayBlocks(g.text).forEach(function(b,i){
        var body=b.lines.join('\n').replace(/^\n+|\n+$/g,'');if(!body&&!b.title)return;
        h+='<section class="card">'+(b.title?'<h2>'+esc(b.title)+'</h2>':'<h2>開局資訊</h2>')+'<pre class="rv">'+esc(body)+'</pre></section>';
      });
      app.innerHTML=h;return;
    }
    REVID=null;
  }
  var h='<header><h1>🐺 過往賽後回顧</h1><div class="sub">只顯示已結束且主持人公開的局</div></header>';
  if(REVERR)h+='<section class="card"><div class="empty">'+esc(REVERR)+'</div></section>';
  else if(!REV.length)h+='<section class="card"><div class="empty">目前還沒有公開的回顧</div></section>';
  else h+='<section class="card">'+REV.map(function(g){
    var w={good:'好人勝',wolf:'狼人勝',third:'第三方勝'}[g.winner]||'已結束';
    return '<div class="vote" data-rev="'+g.id+'" style="cursor:pointer"><span class="n">'+esc(w)+'</span><div class="who">'+(g.no!=null?'第 '+g.no+' 局　':'')+fmtD(g.created)+'　'+esc(g.boardName||'')+'</div><div class="by">'+g.players+' 人 ・ 點開看逐夜回顧</div></div>';
  }).join('')+'</section>';
  app.innerHTML=h;
}
function watchStart(code){
  if(WUNSUB){WUNSUB();WUNSUB=null;}
  WC=code;WD=null;WERR=null;
  WUNSUB=onSnapshot(doc(db,'watch',code),function(snap){
    if(!snap.exists()){WD=null;WERR='觀戰碼無效或已關閉';}else{WD=snap.data();WERR=null;try{localStorage.setItem('wwWatch',code);}catch(e){}}
    if(TAB==='watch')render();
  },function(err){WD=null;WERR='觀戰碼無效或已關閉';if(TAB==='watch')render();});
}
function renderWatch(app){
  if(WC&&WD&&WD.rv){
    try{app.innerHTML=rvPage({no:null,boardName:WD.boardName,created:WD.created,players:WD.players,winner:WD.winner},WD.rv,{noBack:true});return;}catch(e){WERR='資料顯示失敗';}
  }
  var h='<header><h1>👁 觀戰</h1><div class="sub">出局後向上帝索取 6 碼觀戰碼，輸入即可看完整資訊</div></header><section class="card"><div class="row"><input id="wcode" maxlength="6" autocomplete="off" autocapitalize="characters" value="'+esc(WCODE)+'" style="font:900 1.4rem monospace;letter-spacing:.2em;text-transform:uppercase;width:9em;padding:6px 10px;border-radius:10px;border:1px solid var(--line,#ccc)"><button data-wgo="1">進入</button></div>'+(WERR?'<div class="empty" style="color:#c0392b">'+esc(WERR)+'</div>':(WC?'<div class="empty">連線中…</div>':''))+'</section>';
  app.innerHTML=h;
}
function render(){
  var app=$('#app');
  app.innerHTML='<div class="tabs"><button data-tab="live" class="'+(TAB==='live'?'on':'')+'">本局</button><button data-tab="past" class="'+(TAB==='past'?'on':'')+'">過往</button><button data-tab="watch" class="'+(TAB==='watch'?'on':'')+'">觀戰</button></div><div id="pane"></div>';
  if(TAB==='past')renderPast($('#pane'));else if(TAB==='watch')renderWatch($('#pane'));else renderLive($('#pane'));
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-tab]');
  if(t){TAB=t.getAttribute('data-tab');REVID=null;render();return;}
  if(e.target.closest&&e.target.closest('[data-wgo]')){var i=$('#wcode');var c=(i&&i.value||'').trim().toUpperCase();WCODE=c;if(c.length===6){watchStart(c);}else{WERR='請輸入 6 碼';}render();return;}
  if(e.target.closest&&e.target.closest('[data-wleave]')){if(WUNSUB){WUNSUB();WUNSUB=null;}WC=null;WD=null;WERR=null;WCODE='';try{localStorage.removeItem('wwWatch');}catch(e2){}render();return;}
  var v=e.target.closest&&e.target.closest('[data-rev]');
  if(v){REVID=+v.getAttribute('data-rev');render();window.scrollTo(0,0);return;}
  if(e.target.closest&&e.target.closest('[data-back]')){REVID=null;render();}
});
function setStatus(ok,txt){var e=$('#st');e.textContent=txt;e.className='status'+(ok?'':' off');}
onSnapshot(doc(db,'public','current'),function(snap){
  ERR=null;P=snap.exists()?snap.data():null;
  if(P&&LASTGAME!==P.gameId){LASTGAME=P.gameId;}
  setStatus(!snap.metadata.fromCache,snap.metadata.fromCache?'離線・顯示舊資料':'即時連線');
  render();
},function(err){ERR='讀取失敗：'+(err&&err.code?err.code:err);P=null;setStatus(false,'連線失敗');render();});
window.addEventListener('offline',function(){setStatus(false,'離線');});
onSnapshot(query(collection(db,'reviews'),orderBy('id','desc'),limit(30)),function(snap){
  REVERR=null;REV=[];snap.forEach(function(d){var x=d.data();if(x&&x.id!=null)REV.push(x);});
  if(TAB==='past')render();
},function(err){REVERR='讀取失敗：'+(err&&err.code?err.code:err);REV=[];if(TAB==='past')render();});
</script>
</body>
</html>
