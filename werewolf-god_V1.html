<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>狼人殺・上帝手記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --sans:'Noto Sans TC','PingFang TC','Heiti TC','Microsoft JhengHei',system-ui,sans-serif;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --bg:#e8ecf3; --surface:#fbfcfe; --surface2:#eef1f7; --ink:#14172b; --muted:#5f647c; --line:#cfd5e3;
  --primary:#2b2f6b; --on-primary:#ffffff; --accent:#e0a82e; --on-accent:#2b1e00; --danger:#b8322a;
  --wolf:#b8322a; --wolf-bg:#f5d9d6; --god:#2a63ad; --god-bg:#d8e5f5; --good:#2f7d57; --good-bg:#d6ecdf; --third:#7443ae; --third-bg:#e6dbf4;
  --head:#f1c24a; --on-head:#2b1e00;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e1c; --surface:#151a30; --surface2:#1e2440; --ink:#eceef8; --muted:#9aa1c2; --line:#2d345a;
    --primary:#f1cf6b; --on-primary:#1a1630; --accent:#f1cf6b; --on-accent:#1a1630; --danger:#ff8578;
    --wolf:#ff8578; --wolf-bg:#3a1e2a; --god:#84b8f2; --god-bg:#1c2b49; --good:#74d3a4; --good-bg:#183a2f; --third:#c8a6f7; --third-bg:#32234e;
    --head:#d9aa32; --on-head:#1b1300;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e1c; --surface:#151a30; --surface2:#1e2440; --ink:#eceef8; --muted:#9aa1c2; --line:#2d345a;
  --primary:#f1cf6b; --on-primary:#1a1630; --accent:#f1cf6b; --on-accent:#1a1630; --danger:#ff8578;
  --wolf:#ff8578; --wolf-bg:#3a1e2a; --god:#84b8f2; --god-bg:#1c2b49; --good:#74d3a4; --good-bg:#183a2f; --third:#c8a6f7; --third-bg:#32234e;
  --head:#d9aa32; --on-head:#1b1300;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h2{font:900 1.3rem/1.3 var(--serif)}
h3{font:700 1.05rem/1.4 var(--sans)}
h4{font:700 .95rem/1.4 var(--sans);color:var(--muted);margin:14px 0 8px}
.muted{color:var(--muted);font-size:.92rem}
.center{text-align:center}

/* 頂部列 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:900 1.15rem var(--serif);white-space:nowrap}
.logo{font-size:1.4rem}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tab{padding:0 18px;min-height:46px;border-radius:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--primary);color:var(--on-primary)}
.tools{display:flex;gap:6px}
.tool{min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;white-space:nowrap}
.tool:disabled{opacity:.4}
.wrap{max-width:1440px;margin:0 auto;padding:18px}

/* 通用元件 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:980px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-bottom:0}}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:50px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{min-height:58px;font-size:1.1rem;padding:0 26px}
.btn:disabled{opacity:.4}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;background:var(--surface)}
.chip.lg{min-height:48px;padding:0 18px}
.chip.cur{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.done{border-color:var(--good);color:var(--good)}
.chip:disabled{opacity:.35}
.steps,.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.85rem;font-weight:700}
.pill.c-wolf{background:var(--wolf-bg);color:var(--wolf)}
.pill.c-god{background:var(--god-bg);color:var(--god)}
.pill.c-good{background:var(--good-bg);color:var(--good)}
.pill.c-third{background:var(--third-bg);color:var(--third)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.c-wolf{background:var(--wolf)}.dot.c-god{background:var(--god)}.dot.c-good{background:var(--good)}.dot.c-third{background:var(--third)}
.note{margin:10px 0;padding:10px 14px;border-radius:12px;background:var(--surface2);border-left:5px solid var(--accent);font-size:.95rem}
.note.warn{border-left-color:var(--danger)}
.hint .btn{background:var(--on-accent);color:var(--accent);border-color:transparent}
.hint{margin:0 0 16px;padding:14px 18px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* 座位 */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.seats.big{grid-template-columns:repeat(auto-fill,minmax(82px,1fr));margin:12px 0}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 4px 9px;border-radius:14px;background:var(--surface2);border:2px solid var(--line)}
.seat b{font:900 1.45rem/1.1 var(--serif)}
.seat small{font-size:.74rem;color:var(--muted);line-height:1.2}
.seat em{font-style:normal;font-size:.7rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.c-wolf{box-shadow:inset 0 -5px 0 var(--wolf)}
.seat.c-god{box-shadow:inset 0 -5px 0 var(--god)}
.seat.c-good{box-shadow:inset 0 -5px 0 var(--good)}
.seat.c-third{box-shadow:inset 0 -5px 0 var(--third)}
.seat.sel{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seat.sel small,.seat.sel em{color:var(--on-primary)}
.seat.dead{opacity:.42}
.seat.dead b{text-decoration:line-through}
.seat:disabled{opacity:.3}
.tg{position:absolute;top:-7px;font-style:normal;font-size:.75rem;font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 4px}
.tg.sh{right:-6px;background:var(--accent);color:var(--on-accent)}
.tg.cd{left:-6px;background:var(--ink);color:var(--bg)}
.tg.ex{left:-6px;top:auto;bottom:-6px;background:var(--good);color:#fff}
.tg.lv{right:-6px;top:auto;bottom:-6px;background:var(--third);color:#fff}
.tg.cv{right:-6px;top:auto;bottom:-6px;background:var(--wolf);color:#fff}

/* 開局 */
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pname{display:flex;flex-direction:column;min-width:0}
.pname .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);font-size:1.3rem;font-weight:700;background:var(--surface2)}
.stepper b{min-width:30px;text-align:center;font:900 1.2rem var(--serif)}
.grp{display:flex;align-items:center}
.order{font:700 1.05rem/1.8 var(--serif)}
.startbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px;padding-top:6px}

/* 主持 */
.play{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.play{grid-template-columns:236px minmax(0,1fr) 300px;align-items:start}}
.play .card{margin-bottom:16px}
.rail{position:relative}
.rail .seats{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
@media(min-width:900px){.rail{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}.rail .seats{grid-template-columns:repeat(2,1fr)}}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stagebar h1{font:900 1.7rem/1.2 var(--serif)}
.kicker{color:var(--muted);font-size:.9rem;font-weight:700}
.stephead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.script{margin:12px 0;padding:14px 20px;border-left:6px solid var(--accent);background:var(--surface2);border-radius:0 16px 16px 0}
.say{font:700 1.5rem/1.75 var(--serif);margin:.15em 0}
.say.soft{font:500 1.02rem/1.6 var(--sans);color:var(--muted)}
.si{display:inline-block;margin-right:10px}
.si.dead{text-decoration:line-through;opacity:.6}
.nav{margin-top:18px;justify-content:space-between}
.verdict{margin:12px 0;padding:16px;border-radius:16px;font:900 1.5rem var(--serif);text-align:center}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--wolf-bg);color:var(--wolf)}
.n0row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.n0row .say{font-size:1.15rem}
.check{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-size:1.3rem;font-weight:900;color:var(--on-primary)}
.n0row.done .check{background:var(--good);border-color:var(--good)}
.n0row.done{opacity:.6}
.rd{border-bottom:1px dashed var(--line);padding:8px 0}
.rd summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.rd p{font-size:.93rem;margin:6px 0}
.rd ul{margin:4px 0 6px;padding-left:20px;font-size:.9rem;color:var(--muted)}
.timer{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tdisp{font:900 3rem/1 var(--serif);font-variant-numeric:tabular-nums}
.tdisp.end{color:var(--danger)}
.trig{border-color:var(--accent);border-width:2px}
.speak{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.speak span{min-width:48px;padding:6px 10px;border-radius:12px;background:var(--surface2);font:900 1.2rem var(--serif);text-align:center}
.speak span.first{background:var(--primary);color:var(--on-primary)}
.speak span.wd{opacity:.4;text-decoration:line-through}
.card.watch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
.wcode{font:900 1.5rem var(--serif);letter-spacing:.18em;padding:2px 12px;border-radius:12px;background:var(--surface2)}

/* 紀錄表 */
.sheetwrap{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--surface)}
table.sheet{border-collapse:collapse;width:100%;min-width:780px}
.sheet th,.sheet td{border:1px solid var(--line);padding:4px 6px;text-align:center;height:54px;font-size:1rem}
.sheet thead th{background:var(--head);color:var(--on-head);font-weight:700}
.sheet .title{font:900 1.5rem var(--serif);padding:12px;background:var(--surface);color:var(--ink);height:auto}
.sheet th.rolecell{font-weight:700;width:96px}
.sheet tr.camp-wolf th.rolecell{background:var(--wolf-bg);color:var(--wolf)}
.sheet tr.camp-god th.rolecell{background:var(--god-bg);color:var(--god)}
.sheet tr.camp-good th.rolecell{background:var(--good-bg);color:var(--good)}
.sheet tr.camp-third th.rolecell{background:var(--third-bg);color:var(--third)}
.sheet td.seatcell{width:92px;position:relative;cursor:pointer}
.sheet td.seatcell b{font:900 1.35rem var(--serif)}
.sheet td.seatcell small{display:block;font-size:.72rem;color:var(--muted);line-height:1.1}
.sheet td.seatcell i{font-style:normal;font-weight:700;font-size:.8rem;margin:0 2px}
.sheet .up{font-size:.7rem;border:1px solid var(--ink);border-radius:999px;padding:0 4px}.vrec{background:var(--surface2);margin-top:12px}.sheet .plus{color:var(--ink)}.sheet .badge{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px}.sheet .x{color:var(--danger)}
.sheet tr.isdead td.seatcell b{text-decoration:line-through;opacity:.6}
.sheet td.cellbtn{cursor:pointer;font:500 1.15rem var(--sans)}
.sheet td.off{color:var(--muted);opacity:.6}
.sheet tfoot td,.sheet tfoot th{background:var(--surface2)}
.sheet td.edit{cursor:pointer}
.sheet .lbl{font-weight:700;background:var(--surface2)}
.sheet .foot{padding:12px;font-weight:700;background:var(--surface);height:auto}

/* 彈窗 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,20,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.modal h2{margin-bottom:12px}
.modal label{display:block;font-weight:700;margin:12px 0 6px}
.modal input[type=text],.modal textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.modal textarea{min-height:110px;resize:vertical}
.modal .btnrow{margin-top:16px}

.inp{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);min-height:50px;flex:1;min-width:140px}
.regbox{background:var(--surface2);margin-bottom:14px}
.tallyrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.tl{display:flex;align-items:center;gap:4px;padding:4px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2)}
.tl b{min-width:34px;text-align:center;font:900 1.1rem var(--serif)}
.tl span{min-width:22px;text-align:center;font-weight:700}
.tl button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;background:var(--surface)}
.modal label input[type=checkbox]{width:22px;height:22px;margin-right:8px;vertical-align:middle}
@page{size:A4 landscape;margin:10mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint,.topbar,#modal{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .wrap{padding:0;max-width:none}
  .sheetwrap{overflow:visible;border:1.5px solid #000;border-radius:0;break-inside:avoid;page-break-inside:avoid}
  table.sheet{min-width:0;width:100%}
  .sheet tr{break-inside:avoid;page-break-inside:avoid}
  .sheet th,.sheet td{height:auto;padding:3px 4px;font-size:11px;border-color:#555}
  .sheet td.cellbtn{font-size:11px}
  .sheet .title{font-size:16px;padding:6px}
  .sheet .foot{font-size:10.5px;padding:6px}
}
@media(prefers-reduced-motion:no-preference){
  .seat,.btn,.chip,.tab{transition:background-color .12s,border-color .12s,color .12s}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script type="module">
/* ================= Firebase 連線層 ================= */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,onSnapshot,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var firebaseConfig={
  apiKey:"AIzaSyDVWEnINOZf2bGuC7SxHm4_JOqJGq6AixQ",
  authDomain:"werewolf-game-soymilk.firebaseapp.com",
  projectId:"werewolf-game-soymilk",
  storageBucket:"werewolf-game-soymilk.firebasestorage.app",
  messagingSenderId:"267788587461",
  appId:"1:267788587461:web:6932c7ea6ee1c0b9813bac",
  measurementId:"G-XRS9M2N6YP"
};
var TEAM_EMAIL="team@werewolf-game-soymilk.local"; /* 共用帳號：請在 Firebase 主控台建立這組 Email/Password 帳號，密碼就是給大家的通關密語 */

var fbApp=initializeApp(firebaseConfig);
var auth=getAuth(fbApp);
var db=getFirestore(fbApp);

var FB={
  authReady:false,user:null,online:navigator.onLine,lastError:null,
  _authCb:[],_gameCb:[],_rosterCb:[],_configCb:[],_histCb:[],
  onHistory:function(cb){this._histCb.push(cb);},
  saveHistory:function(id,o){try{return setDoc(doc(db,'history',id),o);}catch(e){return Promise.reject(e);}},
  deleteHistory:function(id){try{return deleteDoc(doc(db,'history',id));}catch(e){return Promise.reject(e);}},
  saveReview:function(id,o){try{return setDoc(doc(db,'reviews',id),o);}catch(e){return Promise.reject(e);}},
  deleteReview:function(id){try{return deleteDoc(doc(db,'reviews',id));}catch(e){return Promise.reject(e);}},
  saveWatch:function(id,o){try{return setDoc(doc(db,'watch',id),o);}catch(e){return Promise.reject(e);}},
  deleteWatch:function(id){try{return deleteDoc(doc(db,'watch',id));}catch(e){return Promise.reject(e);}},
  onAuth:function(cb){this._authCb.push(cb);if(this.authReady)cb(this.user);},
  onGame:function(cb){this._gameCb.push(cb);},
  onRoster:function(cb){this._rosterCb.push(cb);},
  onConfig:function(cb){this._configCb.push(cb);},
  signIn:function(pw){
    FB.lastError=null;
    return signInWithEmailAndPassword(auth,TEAM_EMAIL,pw).catch(function(e){FB.lastError=e&&e.code?e.code:'登入失敗';throw e;});
  },
  signOut:function(){return signOut(auth);},
  saveGame:function(G){try{return setDoc(doc(db,'games','current'),JSON.parse(JSON.stringify(G)));}catch(e){return Promise.resolve();}},
  savePublic:function(o){try{return setDoc(doc(db,'public','current'),o);}catch(e){return Promise.resolve();}},
  saveRoster:function(list){try{return setDoc(doc(db,'roster','main'),{list:list});}catch(e){return Promise.resolve();}},
  saveConfig:function(cfg){try{return setDoc(doc(db,'config','boards'),cfg);}catch(e){return Promise.resolve();}},
  archiveGame:function(G){try{var c=JSON.parse(JSON.stringify(G));c.archivedAt=serverTimestamp();return addDoc(collection(db,'history'),c);}catch(e){return Promise.resolve();}}
};
window.FB=FB;

var unsub=[];
onAuthStateChanged(auth,function(u){
  FB.user=u;FB.authReady=true;
  (unsub||[]).forEach(function(f){try{f();}catch(e){}});unsub=[];
  if(u){
    unsub.push(onSnapshot(doc(db,'games','current'),function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return; /* 自己剛寫入、還沒回來的，跳過，避免覆蓋正在編輯的畫面 */
      FB._gameCb.forEach(function(cb){cb(snap.exists()?snap.data():null);});
    }));
    unsub.push(onSnapshot(collection(db,'history'),function(snap){
      var arr=[];snap.forEach(function(d){arr.push({docId:d.id,data:d.data()});});
      FB._histCb.forEach(function(cb){cb(arr,!!(snap.metadata&&snap.metadata.fromCache));});
    }));
    unsub.push(onSnapshot(doc(db,'roster','main'),function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      FB._rosterCb.forEach(function(cb){cb(snap.exists()?(snap.data().list||[]):null);});
    }));
    unsub.push(onSnapshot(doc(db,'config','boards'),function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      FB._configCb.forEach(function(cb){cb(snap.exists()?snap.data():null);});
    }));
  }
  FB._authCb.forEach(function(cb){cb(u);});
});
window.addEventListener('online',function(){FB.online=true;window.dispatchEvent(new Event('fb-net-change'));});
window.addEventListener('offline',function(){FB.online=false;window.dispatchEvent(new Event('fb-net-change'));});
window.dispatchEvent(new Event('fb-boot'));
</script>
<script>
(function(){
'use strict';

  (nt.draft||[]).forEach(function(x){if(!isDead(G,x.seat))G.deaths.push({seat:x.seat,day:d,phase:'N',cause:x.cause,by:x.by});});
  nt.committed=true;
}
function removeDeathsWhere(G,pred){
  var gone=G.deaths.filter(pred).map(function(x){return x.seat;});
  G.deaths=G.deaths.filter(function(x){return !pred(x);});
  gone.forEach(function(n){delete G.trig[n];});
  var more=G.deaths.filter(function(x){return x.by!=null&&gone.indexOf(x.by)>=0;});
  if(more.length)removeDeathsWhere(G,function(x){return x.by!=null&&gone.indexOf(x.by)>=0;});
}

function addDeath(G,x){
  if(isDead(G,x.seat))return;
  G.deaths.push(x);
  var id=G.seats[x.seat];
  if(id==='wolfbeauty'&&x.cause!=='騎士驗中'){
    var sl=t1(G,x.day,'wolfbeauty');
    if(sl!=null&&!isDead(G,sl))addDeath(G,{seat:sl,day:x.day,phase:x.phase,cause:'連帶',by:x.seat});
  }
  if(G.lovers&&G.lovers.indexOf(x.seat)>=0){
    var o=G.lovers[0]===x.seat?G.lovers[1]:G.lovers[0];
    if(o!=null&&!isDead(G,o))addDeath(G,{seat:o,day:x.day,phase:x.phase,cause:'殉情',by:x.seat});
  }
}

/* ================= 觸發（開槍／警徽）與勝負提示 ================= */
function canShoot(G,x){
  var id=G.seats[x.seat],r=ROLES[id];if(!r)return null;
  var gunLucky=!!(G.lucky&&G.lucky.seat===x.seat&&G.lucky.gift==='gun'&&!luckyFail(G));
  var gunMech=!!(G.mech&&mechType(G)==='gun'&&seatsOfRole(G,'mechwolf')[0]===x.seat);
  var gun=(id==='hunter'||(r.onDeath&&true));
  if(!gun&&!gunLucky&&!gunMech)return null;
  if(HARD_MUTE.indexOf(x.cause)>=0)return false;
  if(lostSkill(G,x.seat))return false;
  if(!gun&&gunMech)return (rules(G).hunterNoShoot||[]).indexOf(x.cause)<0;
  if(id==='hunter'){
    if(x.phase==='N'&&x.cause!=='開槍'){var a=night(G,x.day).act.hunter;if(a&&a.g)return a.g==='O';}
    return (rules(G).hunterNoShoot||[]).indexOf(x.cause)<0;
  }
  if(!(r.onDeath))return (rules(G).hunterNoShoot||[]).indexOf(x.cause)<0;
  return (r.onDeath.noShoot||[]).indexOf(x.cause)<0;
}
function pendingTriggers(G){
  var out=[];
  G.deaths.forEach(function(x){
    var c=canShoot(G,x);
    if(c!==null&&!G.trig[x.seat])out.push({type:'shoot',seat:x.seat,cause:x.cause,can:c});
  });
  if(G.sheriff!=null&&isDead(G,G.sheriff))out.push({type:'badge',seat:G.sheriff});
  return out;
}
function counts(G){var c={wolf:0,god:0,good:0,third:0};aliveSeats(G).forEach(function(n){if(G.seats[n]==='cupid')return;c[campOf(G,n)]++;});return c;}
function hasCampSeat(G,camp){return seatsList(G).some(function(n){var r=roleOf(G,n);return r&&G.seats[n]!=='cupid'&&r.camp===camp;});}
function winHint(G){
  var c=counts(G),rl=rules(G);
  if(G.lovers&&loversType(G)==='third'&&c.third>0){
    if(c.wolf+c.god+c.good===0)return {text:'情侶第三方存活，其餘玩家已全數出局（屠城）→ 第三方勝利',w:'third'};
    return null;
  }
  if(G.pool.wolfwitch>0&&c.wolf===0&&hasCampSeat(G,'god')&&c.god===0)return {text:'狼人與神職同時全數出局（狼巫驗殺優先）→ 狼人陣營勝利',w:'wolf'};
  if(c.wolf===0)return {text:'狼人陣營已全數出局 → 好人陣營勝利',w:'good'};
  if(c.third>0)return null;
  if(hasCampSeat(G,'god')&&c.god===0)return {text:'神職已全數出局（屠神）→ 狼人陣營勝利',w:'wolf'};
  if(hasCampSeat(G,'good')&&c.good===0)return {text:'平民已全數出局（屠民）→ 狼人陣營勝利',w:'wolf'};
  if(rl.hostage&&c.wolf>=c.god+c.good)return {text:'狼人數量已不少於其餘玩家（綁票）→ 狼人陣營勝利',w:'wolf'};
  return null;
}
function seqFrom(G,pool,start,dir){
  var N=G.players,seq=[];
  for(var k=0;k<N;k++){var n=(((start-1+dir*k)%N)+N)%N+1;if(pool.indexOf(n)>=0)seq.push(n);}
  return seq;
}
function sheriffAlive(G){return G.sheriff!=null&&!isDead(G,G.sheriff);}
function sheriffStart(G,dir){
  var N=G.players,alive=aliveSeats(G);
  for(var k=1;k<N;k++){var n=(((G.sheriff-1+dir*k)%N)+N)%N+1;if(alive.indexOf(n)>=0)return n;}
  return null;
}
function dayOrder(G,d){
  var o=G.days[d]&&G.days[d].order;if(!o)return null;
  var alive=aliveSeats(G);
  if(o.mode==='sheriff'){
    if(!sheriffAlive(G))return null;
    var st=sheriffStart(G,o.dir);if(st==null)return {o:o,seq:[G.sheriff]};
    var seq=seqFrom(G,alive.filter(function(n){return n!==G.sheriff;}),st,o.dir);seq.push(G.sheriff);
    return {o:o,seq:seq};
  }
  if(sheriffAlive(G))return null;
  return {o:o,seq:seqFrom(G,alive,o.start,o.dir)};
}
function seqTxt(seq,wd){wd=wd||[];return '<div class="speak">'+seq.map(function(n,i){var c=(i===0?'first':'')+(wd.indexOf(n)>=0?' wd':'');return '<span'+(c.trim()?' class="'+c.trim()+'"':'')+'>'+n+'</span>';}).join('')+'</div>';}
function votesOf(G,key){return (G.votes&&G.votes[key])||{};}
function voteWeight(G,key,m){return (key.charAt(0)==='D'&&G.sheriff===m)?1.5:1;}
function weightedCount(G,key,arr){return (arr||[]).reduce(function(s,m){return s+voteWeight(G,key,m);},0);}
function voteGroups(G,key){
  var v=votesOf(G,key),g={};
  Object.keys(v).forEach(function(k){(g[v[k]]=g[v[k]]||[]).push(+k);});
  Object.keys(g).forEach(function(t){g[t].sort(function(a,b){return a-b;});});
  return g;
}
function voteTally(G,key,targets){
  var g=voteGroups(G,key),best=0,win=[];
  targets.forEach(function(t){var c=weightedCount(G,key,g[t]);if(c>best){best=c;win=[t];}else if(c>0&&c===best)win.push(t);});
  return {best:best,win:win};
}
function isPkKey(k){return k==='S2'||/^D\d+p$/.test(k);}
function pkKeyOf(k){return k==='S'?'S2':k+'p';}
function baseKeyOf(k){return k==='S2'?'S':k.replace(/p$/,'');}
function pkOf(G,k){return (G.pk&&G.pk[k])||null;}
function voteLabel(k,G){
  var pk=isPkKey(k),b=baseKeyOf(k);
  return (b==='S'?'警長投票':'第'+CN[+b.slice(1)]+'天放逐投票')+(pk?'・PK 輪':((G&&pkOf(G,b))?'・第一輪':''));
}
function pkSeq(G,pk){return seqFrom(G,pk.seats,pk.start,pk.dir);}
function eligibleVoters(G,key){
  var b=baseKeyOf(key),pk=isPkKey(key),alive=aliveSeats(G);
  if(b==='S'){
    var cands=(G.cand||[]).filter(function(n){return !isDead(G,n);}),wd=(G.sh&&G.sh.withdrawn)||[];
    if(!pk)return alive.filter(function(m){return cands.indexOf(m)<0;});
    var t=pkOf(G,'S');if(!t)return [];
    return alive.filter(function(m){return cands.indexOf(m)<0||(wd.indexOf(m)<0&&t.seats.indexOf(m)<0);});
  }
  var d=+b.slice(1),dd=G.days[d]||{};
  var v1=seatsList(G).filter(function(m){return !isDead(G,m)||m===dd.out;}).filter(function(m){return !(G.idiot[m]>0&&G.idiot[m]<d);});
  if(!pk)return v1;
  var tp=pkOf(G,b);return tp?v1.filter(function(m){return tp.seats.indexOf(m)<0;}):[];
}
function voteResultHTML(G,key,targets,voters){
  var v=votesOf(G,key);if(!Object.keys(v).length)return '';
  var r=voteTally(G,key,targets),isS=baseKeyOf(key)==='S',pkRound=isPkKey(key),unrec=voters.filter(function(m){return v[m]===undefined;});
  var none=isS?'警徽流失（無人當選）':'無人出局，進天黑';
  var h='<div class="note" style="margin-bottom:10px"><b>票型結果（'+voteLabel(key,G)+'）</b>：';
  if(!r.win.length)h+='沒有人得票（全部棄票）。<div class="btnrow" style="margin-top:8px"><button class="btn" data-a="vtTie" data-key="'+key+'">'+none+'</button></div>';
  else if(r.win.length===1)h+=r.win[0]+' 號最高，'+r.best+' 票。<div class="btnrow" style="margin-top:8px"><button class="btn primary" data-a="vtApply" data-key="'+key+'" data-seat="'+r.win[0]+'">'+(isS?'採用：'+r.win[0]+' 號當選警長':'採用：'+r.win[0]+' 號放逐出局')+'</button></div>';
  else if(!pkRound)h+='平票：'+r.win.join('、')+' 號各 '+r.best+' 票。<div class="btnrow" style="margin-top:8px"><button class="btn primary" data-a="vtPk" data-key="'+key+'">進入 PK（'+r.win.join('、')+' 號發言）</button><button class="btn" data-a="vtTie" data-key="'+key+'">不 PK，直接'+none+'</button></div>';
  else h+='PK 輪仍然平票：'+r.win.join('、')+' 號各 '+r.best+' 票。<div class="btnrow" style="margin-top:8px"><button class="btn primary" data-a="vtTie" data-key="'+key+'">'+none+'</button></div>';
  if(unrec.length)h+='<p class="warn" style="margin:8px 0 0">⚠ 還有 '+unrec.length+' 人沒記錄（'+unrec.join('、')+' 號），結果可能會變；玩家頁會顯示「尚未記錄」。</p><div class="btnrow" style="margin-top:6px"><button class="btn" data-a="vtFillAbstain" data-key="'+key+'">把這 '+unrec.length+' 人全部標為棄票</button></div>';
  return h+'</div>';
}
function pkBlock(G,key,pk){
  if(!pk)return '';

function voteRecHTML(G,key,voters,targets,note,quiet){
  var open=!!UI.vrecOpen[key],v=votesOf(G,key),cnt=Object.keys(v).length;

  if(!open)return head;
  var tl=targets.concat([0]);

    '<button class="seat c-none'+(cur===0?' sel':'')+'" data-a="vtTarget" data-key="'+key+'" data-seat="0"><b>棄</b><small>'+((g[0]||[]).length)+' 人</small></button>';
  var vgrid=seatsList(G).map(function(m){var t=v[m];return seatBtn(G,m,{a:'vtVoter',d:{key:key},dis:voters.indexOf(m)<0,sel:t!==undefined&&t===cur,sub:t===0?'棄票':(t!==undefined?'→'+t:'')});}).join('');
  var parts=targets.filter(function(t){return g[t];}).map(function(t){return t+' 號 '+weightedCount(G,key,g[t])+' 票（'+g[t].map(function(m){return m+(voteWeight(G,key,m)>1?'(警1.5)':'');}).join('、')+'）';});
  if(g[0])parts.push('棄票 '+g[0].length+' 人（'+g[0].join('、')+'）');

    '<div class="seats">'+vgrid+'</div>'+(cur==null?'<p class="muted" style="margin-top:8px">請先點上方被投的人。</p>':'')+

/* --- 夜晚 --- */
var NOREG={note:1,dream2end:1,convlearn:1,lucky:1,start:1};
function handRoleIds(G){
  return Object.keys(G.pool).filter(function(id){return G.pool[id]>0&&ROLES[id]&&id!=='villager';}).sort(function(a,b){
    var ka=ROLES[a].camp==='wolf'&&isTeamRole(a)&&ROLES[a].order==null?40:ordVal(ROLES[a].steps?ROLES[a].steps[0].k:a);
    var kb=ROLES[b].camp==='wolf'&&isTeamRole(b)&&ROLES[b].order==null?40:ordVal(ROLES[b].steps?ROLES[b].steps[0].k:b);
    return ka-kb||byCamp(ROLES[a],ROLES[b]);
  });
}
function regIds(G,st){
  if(st.kind==='handreg')return handRoleIds(G);
  if(NOREG[st.kind])return [];
  if(st.kind==='wolves')return Object.keys(G.pool).filter(function(id){return G.pool[id]>0&&isTeamRole(id);}).sort(function(a,b){return ROLES[a].sort-ROLES[b].sort;});
  if(st.kind==='brothers')return ['wolfbrother','wolfyounger'].filter(function(id){return G.pool[id]>0;});
  return (st.role&&G.pool[st.role]>0)?[st.role]:[];
}
function regBox(G,st){
  var ids=regIds(G,st);if(!ids.length)return '';
  var sel=ids.indexOf(UI.regRole)>=0?UI.regRole:(ids.filter(function(id){return remaining(G,id)>0;})[0]||ids[0]);
  UI.regRole=sel;
  var chips=ids.map(function(id){return '<button class="chip lg'+(sel===id?' cur':'')+'" data-a="regRole" data-r="'+id+'">'+esc(R(id).name)+'　'+seatsOfRole(G,id).length+' / '+G.pool[id]+'</button>';}).join('');
  var grid='<div class="seats">'+seatsList(G).map(function(n){
    var c=G.seats[n];
    return seatBtn(G,n,{a:'regSeat',sel:ids.indexOf(c)>=0,dis:!!c&&ids.indexOf(c)<0,sub:c?ROLES[c].short:''});
  }).join('')+'</div>';
  var done=ids.every(function(id){return remaining(G,id)<=0;});
  return '<div class="card regbox"><h3>首夜登記身分'+(done?'　✓':'')+'</h3><p class="muted" style="margin-top:4px">'+(ids.length>1?'先選角色，再點座位；再點一次可取消。':'看到誰睜眼就點誰的座位；再點一次可取消。')+'</p><div class="chips" style="margin:10px 0">'+chips+'</div>'+grid+'</div>';
}
function regMissing(G){
  var fill=rules(G).fill||'villager';return Object.keys(G.pool).filter(function(id){return id!=='villager'&&id!==fill&&G.pool[id]>0&&ROLES[id]&&remaining(G,id)>0;}).map(function(id){return ROLES[id].name+' ×'+remaining(G,id);});

function wolfMissing(G){

}
function viewNight(G){
  var d=G.day,steps=nightSteps(G,d),i=Math.min(G.step,steps.length-1),st=steps[i],nt=night(G,d);

  }).join('');
  var body;
  switch(st.kind){
    case 'start':body=stepStart(G,steps,d);break;
    case 'wolves':body=stepWolves(G,d);break;
    case 'witch':body=stepWitch(G,d);break;
    case 'seer':body=stepSeer(G,d);break;
    case 'hunter':body=stepHunter(G,d);break;
    case 'idle':body=stepIdle(G,st,d);break;
    case 'handreg':body=stepHandReg(G,d);break;
    case 'thief':body=stepThief(G,d);break;
    case 'note':body=stepNote(G,st,d);break;
    case 'brothers':body=stepBrothers(G,d);break;
    case 'mech':body=stepMech(G,d);break;
    case 'medium':body=stepMedium(G,d);break;
    case 'grave':body=stepGrave(G,d);break;
    case 'dream2':body=stepDream2(G,d);break;
    case 'dream2end':body=stepDream2End(G,d);break;
    case 'bm':body=stepBM(G,d);break;
    case 'lucky':body=stepLucky(G,d);break;
    case 'gconv':body=stepGconv(G,d);break;
    case 'convlearn':body=stepConvLearn(G,d);break;
    case 'garg':body=stepGarg(G,d);break;
    case 'wwitch':body=stepWWitch(G,d);break;
    case 'wwitch2':body=stepWWitch2(G,d);break;
    case 'pwhite':body=stepPWhite(G,d);break;
    default:body=stepTarget(G,st,d);
  }
  if(G.conv&&d>=2&&lostSkill(G,G.conv.seat)&&st.key!=='convlearn'&&st.key!=='wolves'&&STEP[st.key]&&STEP[st.key].roles.indexOf(G.seats[G.conv.seat])>=0)body=noteBox(['轉化者（'+G.conv.seat+' 號）已入狼隊，原神職技能已失效：這一步照常唸台詞並停頓，避免洩漏身分，但不能行動。'],true)+body;
  var reg=(d===1&&st.kind!=='start'&&(rules(G).regMode!=='hands'||st.kind==='handreg'))?regBox(G,st):'';
  var last=i===steps.length-1,miss=(d===1&&last)?regMissing(G):[];
  var nav='<div class="btnrow nav"><button class="btn" data-a="prev"'+(i===0?' disabled':'')+'>← 上一步</button>'+(last?'<button class="btn primary big" data-a="finishNight"'+(miss.length?' disabled':'')+'>天亮・結算昨夜 →</button>':'<button class="btn primary big" data-a="next"'+((st.key==='gconv'&&d===1&&!G.conv)?' disabled':'')+'>下一步 →</button>')+'</div>';
  return '<div class="card"><div class="steps">'+chips+'</div></div><div class="card">'+reg+body+(miss.length?noteBox(['首夜身分尚未登記完：'+miss.join('、')+'。請回到該角色的步驟登記；沒被叫到的座位會自動成為平民。'],true):'')+nav+'</div>';

function stepStart(G,steps,d){

    '<div class="note">本夜口號順序：'+esc(steps.slice(1).map(function(s){return s.title;}).join(' › '))+'</div>';

function stepIdle(G,st,d){
  var r=R(st.role);
  return stepHead(r.name,r.camp,seatInfo(G,seatsOfRole(G,st.role),d))+scriptBox([r.name+'請睜眼，向上帝確認身分，然後閉眼。'])+noteBox(['此角色只在首夜睜眼確認身分，之後的夜晚不會再叫。']);

function picked0(a){return (a&&a.t)||[];}
function stepTarget(G,st,d){
  var r=R(st.role),nt=night(G,d),a=nt.act[st.key]||{t:[],none:false};
  var seats=seatsOfRole(G,st.role),allDead=seats.length>0&&seats.every(function(n){return deadAtStart(G,n,d);});
  var locked=r.from&&d<r.from,dis=[],notes=[],warn=[];
  if(st.role==='guard'){var pg=t1(G,d-1,'guard');if(pg!=null){dis.push(pg);notes.push('不能連續守護同一人：昨晚守了 '+pg+' 號。');}}
  if(st.role==='dreamer'){var pd=t1(G,d-1,'dreamer');if(pd!=null){if((a.t||[])[0]===pd)warn.push('⚠ 連續第二晚攝夢 '+pd+' 號 → 該玩家將夢死。');else notes.push('昨晚攝夢：'+pd+' 號（連續攝夢同一人會夢死）。');}}
  if(st.role==='wolfbeauty'){var pw=t1(G,d-1,'wolfbeauty');if(pw!=null){dis.push(pw);notes.push('不能連續兩晚睡同一人：昨晚睡了 '+pw+' 號。');}}
  if(st.role==='nightmare'){var pn=t1(G,d-1,'nightmare');if(pn!=null){dis.push(pn);notes.push('不能連續兩晚恐懼同一人：昨晚恐懼了 '+pn+' 號。');}}
  var feared=st.role==='dreamer'&&seats.some(function(n){return isFeared(G,d,n);});
  if(feared)notes.push('夢魘恐懼：攝夢人今晚被恐懼，沒有夢遊者，照常唸台詞並停頓。');
  if(st.role==='cupid'){notes.push('選 2 位玩家連線，可以選自己。');if(picked0(a).length===2)notes.push('配對結果：'+pairLabel(G)+'（依目前登記的身分判斷）。');}
  if(locked)notes.push(r.name+'要到第 '+r.from+' 夜才能使用技能；本夜照常唸台詞、停頓後閉眼即可。');
  if(allDead)notes.push(r.name+'已出局：仍照常唸台詞並停頓，避免洩漏出局資訊。');
  var lines=r.script||[r.name+'請睜眼。',r.name+'請閉眼。'];

    input=picker(G,{key:st.key,sel:picked,dis:dis})+'<div class="btnrow"><button class="btn'+(a.none?' on':'')+'" data-a="none" data-key="'+st.key+'">'+esc(r.none||'不使用')+'</button><span class="muted">'+(picked.length?'已記錄：'+picked.join('、')+' 號':(a.none?'已記錄：'+esc(r.none||'不使用'):'尚未記錄'))+'</span></div>';
  }
  return stepHead(r.name,r.camp,seatInfo(G,seats,d))+scriptBox(lines)+noteBox(notes)+noteBox(warn,true)+input;
}
function stepWolves(G,d){
  var a=night(G,d).act.wolves||{t:[]},base=R('wolf').script||['狼人請睜眼。','請討論戰術，決定今晚要刀誰。','狼人請閉眼。'],present=presentRoles(G);
  var hunt=rules(G).huntGame&&d===1;
  var L=[base[0]];

  }else{
    var done=G.sheriff!=null||s.status==='lost';

    body+='<div class="script"><p class="say">現在開始投票，自爆失效。</p><p class="say soft">'+(tied?'PK 輪：沒退水且未平票的上警玩家、以及所有未上警的玩家可以投票；平票的玩家只能發言。':'上警的玩家（含已退水）不能投票。')+'</p></div>'+
      (tied?pkBlock(G,'S',pk):'')+
      '<h4>當選警長</h4><div class="seats big">'+seatsList(G).map(function(n){return seatBtn(G,n,{a:'sElect',sel:G.sheriff===n,dis:(tied?tied:live).indexOf(n)<0});}).join('')+'</div>'+
      '<div class="note">'+(tied?'PK 輪可投票：'+esc(voters2.join('、')||'（無）')+' 號。':'所有上警的玩家（含已退水）都不能投票。可投票：'+esc(voters.join('、')||'（無）')+' 號。')+'</div>'+
      voteRecHTML(G,'S',voters,live,'僅列出可投票的玩家。',!!tied)+(tied?voteRecHTML(G,'S2',voters2,tied,'PK 輪：平票的玩家不能投票。'):'')+
      '<div class="btnrow nav"><button class="btn" data-a="sNoWinner">平票／無人當選</button><button class="btn primary big" data-a="finishSheriff"'+(done?'':' disabled')+'>完成警長競選 →</button></div>';
  }
  return '<div class="card">'+body+'</div>';
}

/* --- 白天 --- */
function huntWolfDown(G,d){return G.deaths.some(function(x){var r=roleOf(G,x.seat);return x.day===d&&x.phase==='D'&&r&&r.camp==='wolf';});}
function knightCard(G){
  var ks=seatsOfRole(G,'knight');if(!ks.length)return '';

  if(k){
    return '<div class="card"><h2>騎士</h2><div class="script"><p class="say">騎士 '+k.seat+' 號已於第 '+k.day+' 天翻牌，驗 '+k.target+' 號：'+(k.result==='wolf'?'是狼人，該玩家出局並直接進入黑夜。':'是好人，騎士自己淘汰。')+'</p></div>'+(k.day===d?'<div class="btnrow"><button class="btn" data-a="knightUndo">撤銷這次翻牌</button></div>':'')+'</div>';
  }

  return '<div class="card trig"><h3>騎士 '+live[0]+' 號翻牌：驗誰？</h3>'+picker(G,{a:'knightPick',d:{},sel:[],dis:live})+'<div class="btnrow"><button class="btn" data-a="knightOpen">取消</button></div><p class="muted">驗到狼人：狼出局、進入黑夜；驗到好人（神或民）：騎士淘汰，白天繼續。</p></div>';

function viewDay(G){

  }else{
    speak+='<div class="script"><p class="say">請抽發言順序，'+(so?so.o.start+' 號開始，'+(so.o.dir>0?'順向（號碼遞增）':'逆向（號碼遞減）')+'發言。':'X 號開始發言。')+'</p>'+(G.badgeLost?'<p class="say soft">警徽已遺失，沒有警長。</p>':'')+'</div>'+
      '<div class="btnrow"><button class="btn primary" data-a="roll">🎲 '+(so?'重抽':'抽發言起點與方向')+'</button></div>';

    vote+='<div class="script"><p class="say">'+esc(msg)+'</p></div>'+trigHTML(G)+'<div class="btnrow">'+(rules(G).huntGame?'':'<button class="btn" data-a="voteReset">重新選擇</button>')+'</div>';
  }else{
    var dkey='D'+d,dpk=pkOf(G,dkey),dtied=dpk?dpk.seats.filter(function(n){return !isDead(G,n);}):null;
    vote+='<div class="script"><p class="say">'+(dtied?'PK 發言結束，現在進行第二輪投票。'+dtied.join('、')+' 號不能投票。':'發言結束，現在開始投票。')+'</p></div>'+(dtied?pkBlock(G,dkey,dpk):'');
    if(UI.boom){
      vote+='<p class="muted">選擇自爆的狼人：</p><div class="seats big">'+seatsList(G).map(function(n){return seatBtn(G,n,{a:'voteSeat',dis:!canBoomSeat(G,n)});}).join('')+'</div><div class="btnrow"><button class="btn" data-a="boom">取消自爆</button></div>';
    }else{
      vote+='<p class="muted">選擇被放逐的玩家：</p><div class="seats big">'+seatsList(G).map(function(n){return seatBtn(G,n,{a:'voteSeat',dis:isDead(G,n)||(!!dtied&&dtied.indexOf(n)<0)});}).join('')+'</div><div class="btnrow"><button class="btn" data-a="voteNone">平票／無人出局</button><button class="btn danger" data-a="boom">狼人自爆</button></div>';

  var pk0=pkOf(G,'D'+d),pt=pk0?pk0.seats:null,v1=pre.filter(function(m){return !(G.idiot[m]>0&&G.idiot[m]<d);});
  vote+=voteRecHTML(G,'D'+d,v1,pre,((G.pool&&G.pool.idiot>0)||Object.keys(G.idiot||{}).length)?'翻牌後的傻瓜失去投票權。':'',!!pt);
  if(pt)vote+=voteRecHTML(G,'D'+d+'p',v1.filter(function(m){return pt.indexOf(m)<0;}),pt,'PK 輪：平票的玩家不能投票。');
  vote+='</div>';
  var pending=(dd.out==null&&dd.kind!=='none')?trigHTML(G):'';
  var huntWait=rules(G).huntGame&&((dd.out==null&&dd.kind!=='none')||pendingTriggers(G).length>0);
  var next='<div class="btnrow nav"><span class="muted">'+(dd.out!=null||dd.kind==='none'?'':'尚未記錄放逐結果')+(huntWait?'　獵人局：放逐結果與開槍連鎖結束後才能天黑':'')+'</span><button class="btn primary big" data-a="nextNight"'+(huntWait?' disabled':'')+'>天黑請閉眼 → 第 '+(d+1)+' 夜</button></div>';
  return speak+knightCard(G)+vote+(pending?'<div class="card">'+pending+'</div>':'')+next;
}
function trigHTML(G){
  var p=pendingTriggers(G);if(!p.length)return '';

    var r=ROLES[G.seats[t.seat]];
    if(t.type==='shoot'&&G.lucky&&G.lucky.seat===t.seat&&G.lucky.gift==='gun'&&G.seats[t.seat]!=='hunter'&&!(r&&r.onDeath))r={name:'幸運兒（獵槍）'};
    if(t.type==='shoot'){
      if(!t.can)return '<div class="card trig"><h3>'+t.seat+' 號 '+esc(r.name)+'因「'+esc(t.cause)+'」出局，槍被悶掉。</h3><p class="muted">不要宣布技能。</p><div class="btnrow" style="margin-top:10px"><button class="btn" data-a="noShoot" data-from="'+t.seat+'">知道了</button></div></div>';
      return '<div class="card trig"><h3>'+t.seat+' 號啟動角色技能，選擇你要帶走的玩家是？</h3><p class="muted">不要宣布角色身分。（上帝備註：'+esc(r.name)+'）</p>'+picker(G,{a:'shoot',d:{from:t.seat},sel:[]})+'<div class="btnrow"><button class="btn" data-a="noShoot" data-from="'+t.seat+'">不開槍</button></div></div>';
    }
    return '<div class="card trig"><h3>警長 '+t.seat+' 號出局・移交警徽</h3>'+picker(G,{a:'badge',d:{},sel:[]})+'<div class="btnrow"><button class="btn" data-a="badgeTear">撕掉警徽（遺失）</button></div></div>';
  }).join('');
}
function viewOver(G){
  var w={good:'好人陣營勝利',wolf:'狼人陣營勝利',third:'第三方勝利'}[G.winner]||'本局結束';
  return '<div class="card center"><h2>'+w+'</h2><p class="muted" style="margin:8px 0 16px">紀錄表已完整保留，可匯出 PDF、下載 CSV，或存入歷史。</p><div class="btnrow" style="justify-content:center"><button class="btn primary" data-a="tab" data-t="sheet">查看紀錄表</button><button class="btn" data-a="pdf">匯出 PDF</button><button class="btn" data-a="csv">下載 CSV</button><button class="btn" data-a="exportCur">匯出文字</button><button class="btn" data-a="reopenGame">更正・回到遊戲</button><button class="btn" data-a="newGame">開新局</button></div></div>';
}

/* --- 計時器 --- */
var T={total:120,left:120,run:false,h:null};
function fmt(s){return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);}
function stopT(){if(T.h){clearInterval(T.h);T.h=null;}T.run=false;}
function beep(){
  try{
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    var c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.15;o.start();o.stop(c.currentTime+0.5);
  }catch(e){}
}
function tick(){
  T.left=Math.max(0,T.left-1);
  var el=$('#tdisp');if(el){el.textContent=fmt(T.left);el.classList.toggle('end',T.left===0);}
  if(T.left===0){stopT();beep();render();}
}
function timerHTML(){
  return '<div class="timer"><div class="tdisp'+(T.left===0?' end':'')+'" id="tdisp">'+fmt(T.left)+'</div><div class="chips">'+[60,90,120,150,180].map(function(s){return '<button class="chip'+(T.total===s?' cur':'')+'" data-a="tset" data-s="'+s+'">'+s+' 秒</button>';}).join('')+'</div><div class="btnrow"><button class="btn primary" data-a="tgo">'+(T.run?'暫停':'開始')+'</button><button class="btn" data-a="treset">重設</button></div>'+(extraSeats(APP.cur).length?'<p class="muted">已加時：'+extraSeats(APP.cur).join('、')+' 號（＋）</p>':'')+'<div class="btnrow"><button class="btn" data-a="extra">＋ 加時 1 分鐘（每位玩家限 1 次）</button></div>'+'</div>';
}

/* ================= 紀錄表 ================= */
function wolfRowSeat(G,seats){
  var team=seats.filter(function(n){return campOf(G,n)==='wolf'&&isTeamRole(G.seats[n]);});
  return team.filter(function(n){return G.seats[n]==='wolf';})[0]||team.filter(function(n){return ROLES[G.seats[n]].order==null;})[0]||team.filter(function(n){return G.seats[n]!=='fear';})[0]||team[0];
}
function actKeyFor(G,n,wolfSeat){
  if(n===wolfSeat)return 'wolves';
  var r=roleOf(G,n);if(!r||r.kind==='hunter')return null;
  if(r.sheetKey!==undefined)return r.sheetKey;
  return r.order!=null?r.id:null;
}
function specialCell(G,d,key){
  var nt=G.nights[d],a=nt&&nt.act[key];
  if(key==='gravekeeper'){var ex=prevExile(G,d);return ex!=null?ex+(campOf(G,ex)==='wolf'?' 壞':' 好'):undefined;}
  if(key==='cupid'){return (d===1&&G.lovers&&G.lovers.length===2)?G.lovers.join('♡'):undefined;}
  if(key==='blackmarket'){
    if(d===1&&G.lucky&&G.lucky.seat!=null)return '幸'+G.lucky.seat+({seer:'驗',poison:'毒',gun:'槍'}[G.lucky.gift]||'')+(luckyFail(G)?'敗':'');
    var lk=nt&&nt.act.lucky;if(lk&&lk.t&&lk.t.length)return '幸'+(lk.mode==='poison'?'毒':'驗')+lk.t[0];
    return undefined;
  }
  if(key==='mechwolf'&&d===1&&G.mech){var r=ROLES[G.seats[G.mech.from]];return G.mech.from+(r?r.short:'');}
  return undefined;
}
function cellText(G,d,key){
  var nt=G.nights[d],a=nt&&nt.act[key];
  var actors=key==='wolves'?wolfGroup(G):(STEP[key]?STEP[key].roles.reduce(function(acc,id){return acc.concat(seatsOfRole(G,id));},[]):seatsOfRole(G,key));
  var dead=d>=1&&actors.length>0&&actors.every(function(n){return deadAtStart(G,n,d);});
  if(dead&&!a)return '/';
  var sp=specialCell(G,d,key);if(sp!==undefined)return sp;
  if(!a)return '';
  var t=a.t||[];
  switch(key){
    case 'wolves':return a.none?'空刀':(t.length?'殺'+t[0]:'');
    case 'witch':return (a.save!=null?'救'+a.save:'')+(a.poison!=null?'毒'+a.poison:'');
    case 'seer':return t.length?t[0]+(seerVerdict(G,swapper(G,d)(t[0]),d)==='bad'?'壞':'好'):'';
    case 'brothers':return a.none?'X':(t.length?'復仇'+t[0]:'');
    case 'wolfbeauty':return a.none?'不睡':(t.length?'睡'+t[0]:'');
    case 'mechwolf':return t.length?({poison:'毒',shield:'盾',knife:'刀',verify:'驗'}[a.mode]||'')+t[0]:(a.none?'X':'');
    case 'medium':{if(!t.length)return a.none?'X':'';var ir=G.seats[t[0]]==='mechwolf'&&G.mech&&ROLES[G.seats[G.mech.from]]?ROLES[G.seats[G.mech.from]]:roleOf(G,t[0]);return t[0]+(ir?ir.short:'');}
    case 'dreamer2':{if(!t.length)return '';var ac=(a.acted!==undefined&&a.acted!==null)?a.acted:didAct(G,d,t[0]);return '夢'+t[0]+(a.kill?'殺':'')+(ac?'・有':'・無');}
    case 'gconv':return t.length?'轉'+t[0]:(a.none?'X':'');
    case 'wolfwitch':{if(!t.length)return a.none?'X':'';var iw=roleOf(G,t[0]);return '驗'+t[0]+(iw?iw.short:'')+((d>=2&&G.seats[t[0]]==='purewhite')?'殺':'');}
    case 'purewhite':{if(!t.length)return a.none?'X':'';var ip=roleOf(G,t[0]);return '驗'+t[0]+(ip?ip.short:'')+((d>=2&&campOf(G,t[0])==='wolf')?'殺':'');}
    case 'gargoyle':{if(!t.length)return a.none?'X':'';var ir2=roleOf(G,t[0]);return t[0]+(ir2?ir2.short:'');}
    case 'guard':return a.none?'X':(t.length?'守'+t[0]:'');
    case 'demonhunter':return a.none?'X':(t.length?'獵'+t[0]:'');
    case 'magician':return a.none?'X':(t.length===2?t[0]+'/'+t[1]:'');
    case 'zombie':return a.none?'X':t.join('/');
    case 'dreamer':return a.none?'X':(t.length?'攝'+t[0]:'');
    case 'fear':return a.none?'不恐':(t.length?'恐'+t[0]:'');
  }
  return '';
}
function shotText(G,n,d){
  var s=G.deaths.filter(function(x){return x.cause==='開槍'&&x.by===n&&x.day===d;}).map(function(x){return '槍'+x.seat;});
  return s.join('・');
}
function deathsText(G,d,phase){
  var list=G.deaths.filter(function(x){return x.day===d&&x.phase===phase;});
  var tag={'連帶':'(連)','殉情':'(殉)','夢殺':'(夢)','黑市':'(黑)','騎士驗中':'(騎)','騎士自盡':'(騎自)'};
  var txt=list.map(function(x){return x.cause==='開槍'?'→'+x.seat:(x.cause==='自爆'?x.seat+'爆':x.seat+(tag[x.cause]||''));}).join('・');
  if(phase==='D'){var dd=G.days[d];if(dd&&dd.kind==='idiot')txt=(txt?txt+'・':'')+dd.out+'傻(免死)';}
  return txt;
}
function sheetHTML(G,editable){
  var seats=sortedSeats(G);if(!seats.length)return '<div class="card center muted">尚無座位資料</div>';
  var last=Math.max.apply(null,[5,G.day||0].concat(Object.keys(G.nights).map(Number)));
  var days=[];for(var i=1;i<=last;i++)days.push(i);
  var wolfSeat=wolfRowSeat(G,seats);
  var attr=function(a,extra){return editable?' data-a="'+a+'" '+extra:'';};
  var head='<tr><th colspan="'+(days.length+2)+'" class="title">上帝表格　'+fmtDate(G.created)+'</th></tr><tr><th>身分牌</th><th>玩家</th>'+days.map(function(d){return '<th>第'+CN[d]+'天</th>';}).join('')+'</tr>';
  var rows=seats.map(function(n){
    var r=roleOf(G,n),key=actKeyFor(G,n,wolfSeat),dead=isDead(G,n);
    var cells=days.map(function(d){
      var shot=shotText(G,n,d);
      if(!key)return '<td>'+esc(shot)+'</td>';
      var txt=cellText(G,d,key),show=shot?((txt&&txt!=='/')?txt+' '+shot:shot):txt;
      return '<td class="cellbtn'+(txt==='/'&&!shot?' off':'')+'"'+attr('cell','data-d="'+d+'" data-key="'+key+'"')+'>'+esc(show)+'</td>';
    }).join('');
    return '<tr class="camp-'+r.camp+(dead?' isdead':'')+'"><th class="rolecell">'+esc((G.thief&&G.thief.seat===n?'盜賊→':'')+r.name)+(G.lucky&&G.lucky.seat===n&&!luckyFail(G)?'<small>幸運兒</small>':'')+(G.conv&&G.conv.seat===n?'<small>轉化者</small>':'')+(G.lovers&&G.lovers.indexOf(n)>=0?'<small>♡情侶</small>':'')+'</th><td class="seatcell"'+attr('seatModal','data-seat="'+n+'"')+'>'+(hasExtra(G,n)?'<i class="plus">＋</i>':'')+(G.cand.indexOf(n)>=0?'<i class="up">上</i>':'')+'<b>'+n+'</b>'+(G.sheriff===n?'<i class="badge">警</i>':'')+(dead?'<i class="x">✕</i>':'')+(G.names[n]?'<small>'+esc(G.names[n])+'</small>':'')+'</td>'+cells+'</tr>';
  }).join('');
  var nightRow='<tr><td colspan="2" class="lbl">夜晚出局</td>'+days.map(function(d){
    var nt=G.nights[d],txt=deathsText(G,d,'N');
    if(!txt&&nt&&nt.committed)txt='平安夜';
    return '<td class="edit"'+attr('deaths','data-d="'+d+'" data-p="N"')+'>'+esc(txt)+'</td>';
  }).join('')+'</tr>';

function rvPretty(G,d,key){

  var raw=cellText(G,d,key);if(!raw||raw==='/')return null;

    case 'witch':{var p=[];if(a.save!=null)p.push('救 '+n(a.save));if(a.poison!=null)p.push('毒 '+n(a.poison));return p.length?{act:p.join('、')}:null;}
    case 'seer':return t.length?{act:'驗 '+n(t[0]),note:'結果：'+(raw.slice(-1)==='壞'?'壞人':'好人')}:null;
    case 'guard':return t.length?{act:'守 '+n(t[0])}:null;
    case 'gconv':return t.length?{act:'轉化 '+n(t[0])}:null;
    case 'dreamer2':{if(!t.length)return null;var ac=(a.acted!==undefined&&a.acted!==null)?a.acted:didAct(G,d,t[0]);return {act:'夢 '+n(t[0])+(a.kill?'（夢殺）':''),note:ac?'夢遊者有行動':'夢遊者沒行動'};}
    case 'dreamer':return t.length?{act:'攝夢 '+n(t[0])}:null;
    case 'demonhunter':return t.length?{act:'獵 '+n(t[0])}:null;
    case 'wolfbeauty':return t.length?{act:'魅惑 '+n(t[0])}:null;
    case 'fear':return t.length?{act:'恐嚇 '+n(t[0])}:null;
    case 'brothers':return t.length?{act:'復仇 '+n(t[0])}:null;
    case 'gargoyle':case 'wolfwitch':case 'purewhite':case 'medium':{
      if(!t.length)return null;var ir=roleOf(G,t[0]);
      return {act:(key==='gargoyle'||key==='medium'?'查 ':'驗 ')+n(t[0]),note:(ir?'身分：'+ir.name:'')+(/殺$/.test(raw)?'（驗殺）':'')};}
    case 'gravekeeper':{var ex=prevExile(G,d);return ex!=null?{act:'驗 '+n(ex),note:'結果：'+(campOf(G,ex)==='wolf'?'壞人':'好人')}:null;}

    case 'mechwolf':return t.length?{act:({poison:'毒',shield:'盾',knife:'刀',verify:'驗'}[a.mode]||'')+' '+n(t[0])}:null;
  }
  if(a.none)return null;

function rvVotes(G,base){
  var out=[],keys=[base];if(pkOf(G,base))keys.push(pkKeyOf(base));
  keys.forEach(function(k){
    var g=voteGroups(G,k),rows=[],abst=g[0]||[];

      var by=g[t];rows.push({t:t,by:by,cnt:weightedCount(G,k,by),shv:(k.charAt(0)==='D'&&by.indexOf(G.sheriff)>=0)?G.sheriff:null});
    });
    rows.sort(function(a,b){return b.cnt-a.cnt||a.t-b.t;});
    if(!rows.length&&!abst.length)return;
    var pk=isPkKey(k)?pkOf(G,base):null;
    out.push({k:k,title:voteLabel(k,G),pk:pk?{seats:pk.seats.slice(),seq:pkSeq(G,pk)}:null,rows:rows,abst:abst});
  });

}
function reviewData(G){

      votes:rvVotes(G,'D'+d),dOut:dOut,badge:(G.badgeLog||[]).filter(function(b){return b.day===d;}).map(function(b){return {from:b.from,to:b.to==null?null:b.to,lost:!!b.lost,phase:b.phase};}),idiot:(dd.kind==='idiot'&&dd.out!=null)?dd.out:null});
  }

}

function csvCell(v){v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvOf(G){
  var seats=seatsList(G);
  var last=Math.max.apply(null,[1,G.day||0].concat(Object.keys(G.nights).map(Number)));
  var days=[];for(var i=1;i<=last;i++)days.push(i);
  var ws=wolfRowSeat(G,seats);
  var win={good:'好人勝',wolf:'狼人勝',third:'第三方勝'}[G.winner]||'';
  var vs=G.votes||{},hasVotes=Object.keys(vs).length>0,cntOf=function(k,n){var g=voteGroups(G,k);return g[n]?g[n].length:'';},vt=function(k,n){var x=vs[k]&&vs[k][n];return x===undefined?'':(x===0?'棄票':x);};
  var head=['局ID','日期','板子','人數','結果','座位','暱稱','角色','陣營','上警','警長','加時','出局天','出局階段','出局原因'];
  days.forEach(function(d){head.push('第'+d+'夜行動');});

  var rows=[head];
  seats.forEach(function(n){
    var r=roleOf(G,n),dth=G.deaths.filter(function(x){return x.seat===n;})[0],key=actKeyFor(G,n,ws);
    var row=[G.id,fmtDate(G.created),boardName(G),G.players,win,n,G.names[n]||'',r?r.name:'',r?CAMPS[r.camp]:'',G.cand.indexOf(n)>=0?'是':'',G.sheriff===n?'是':'',hasExtra(G,n)?'是':'',dth?dth.day:'',dth?(dth.phase==='N'?'夜晚':'白天'):'',dth?dth.cause:''];
    days.forEach(function(d){var c=key?cellText(G,d,key):'',s=shotText(G,n,d);row.push(s?((c&&c!=='/')?c+' '+s:s):c);});
    if(hasVotes){row.push(vt('S',n),cntOf('S',n),vt('S2',n),cntOf('S2',n));days.forEach(function(d){row.push(vt('D'+d,n),cntOf('D'+d,n),vt('D'+d+'p',n),cntOf('D'+d+'p',n));});}
    rows.push(row);
  });
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
}

/* ================= 渲染 ================= */
function render(){
  persist();
  var root=document.documentElement;
  if(APP.theme)root.setAttribute('data-theme',APP.theme);else root.removeAttribute('data-theme');
  if(window.FB&&(!FB.authReady||!FB.user)){
    $('#app').innerHTML='';
    $('#modal').innerHTML=fbGateView();
    return;
  }
  var views={setup:viewSetup,play:function(){return viewPlay(APP.cur);},sheet:viewSheet,roles:viewRoles,hist:viewHist};
  $('#app').innerHTML=topbar()+'<main class="wrap">'+(views[APP.ui.tab]||viewSetup)()+'</main>';
  $('#modal').innerHTML=UI.modal?modalHTML():'';
}

ACT.board=function(ds){

    G.boardName=b.name;G.pool=JSON.parse(JSON.stringify(b.pool));G.seats={};G.extraCards=b.extraCards||0;G.players=sum(G.pool)-G.extraCards;

ACT.poolAdj=function(ds){mutate(function(G){

  G.boardName='';G.players=sum(G.pool)-(G.extraCards||0);syncOrder(G);
});};
ACT.poolAdd=function(ds){mutate(function(G){G.pool[ds.r]=1;G.boardName='';G.players=sum(G.pool)-(G.extraCards||0);syncOrder(G);});};
ACT.addToggle=function(){UI.addOpen=!UI.addOpen;render();};
ACT.ordMove=function(ds){mutate(function(G){

  var t=a[i];a[i]=a[j];a[j]=t;G.order=a;G.boardName='';
});};
ACT.rule=function(ds){mutate(function(G){G.rules=G.rules||JSON.parse(JSON.stringify(DEFAULT_RULES));G.rules[ds.k]=ds.v;});};
ACT.ruleNoShoot=function(ds){mutate(function(G){
  G.rules=G.rules||JSON.parse(JSON.stringify(DEFAULT_RULES));
  var a=(G.rules.hunterNoShoot||[]).slice(),i=a.indexOf(ds.c);if(i>=0)a.splice(i,1);else a.push(ds.c);G.rules.hunterNoShoot=a;
});};
ACT.start=function(){
  if(!canStart(APP.cur))return;
  mutate(function(G){syncOrder(G);G.seats={};G.lovers=null;G.thief=null;G.conv=null;G.mech=null;G.lucky=null;G.knight=null;G.extras=[];G.badgeLog=[];G.created=new Date().toISOString();if(!G.watchCode)G.watchCode=genWatchCode();G.phase='play';G.day=1;G.stage='night';G.step=0;G.sh=newSh();});

/* 玩家名單與入座 */
function addPerson(name){
  var ex=APP.roster.filter(function(p){return p.name===name;})[0];if(ex)return ex;
  var p={id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1000),name:name};APP.roster.push(p);return p;
}
function unseatPerson(G,id){Object.keys(G.seatPerson||{}).forEach(function(n){if(G.seatPerson[n]===id){delete G.seatPerson[n];delete G.names[n];}});}
function seatPersonAt(G,n,p){unseatPerson(G,p.id);G.seatPerson=G.seatPerson||{};G.seatPerson[n]=p.id;G.names[n]=p.name;if((G.playing||[]).indexOf(p.id)<0)G.playing=(G.playing||[]).concat([p.id]);}
ACT.rosterAdd=function(){
  var el=$('#f-newname'),v=((el&&el.value)||'').trim();if(!v)return;
  var p=addPerson(v);
  mutate(function(G){G.playing=G.playing||[];if(G.playing.indexOf(p.id)<0)G.playing.push(p.id);});
};
ACT.rosterEdit=function(){UI.rosterEdit=!UI.rosterEdit;render();};
ACT.playToggle=function(ds){mutate(function(G){
  G.playing=G.playing||[];var i=G.playing.indexOf(ds.id);
  if(i>=0){G.playing.splice(i,1);unseatPerson(G,ds.id);}else G.playing.push(ds.id);
});};
ACT.personEdit=function(ds){openModal({type:'person',id:ds.id});};
ACT.personSave=function(){
  var p=personOf(UI.modal.id),v=(($('#f-pname')||{}).value||'').trim();if(!p||!v)return;
  p.name=v;UI.modal=null;
  mutate(function(G){Object.keys(G.seatPerson||{}).forEach(function(n){if(G.seatPerson[n]===p.id)G.names[n]=v;});});

ACT.personDel=function(){var p=personOf(UI.modal.id);if(!p)return;UI.delId=p.id;openModal({type:'confirm',title:'從名單刪除？',msg:p.name+' 會從名單移除，歷史紀錄裡的名字不受影響。',go:'personDelDo'});};
ACT.personDelDo=function(){
  var id=UI.delId;APP.roster=APP.roster.filter(function(p){return p.id!==id;});UI.modal=null;
  mutate(function(G){G.playing=(G.playing||[]).filter(function(x){return x!==id;});unseatPerson(G,id);});
};
ACT.sitTap=function(ds){openModal({type:'sit',seat:+ds.seat});};
ACT.sitPick=function(ds){var n=UI.modal.seat,p=personOf(ds.id);if(!p)return;UI.modal=null;mutate(function(G){seatPersonAt(G,n,p);});};
ACT.sitNew=function(){
  var n=UI.modal.seat,v=(($('#f-sitname')||{}).value||'').trim();if(!v)return;

ACT.sitClear=function(){var n=UI.modal.seat;UI.modal=null;mutate(function(G){if(G.seatPerson)delete G.seatPerson[n];delete G.names[n];});};
ACT.clearSeats=function(){mutate(function(G){G.seatPerson={};G.names={};});};
ACT.reuseSeating=function(){
  var L=APP.lastSeating;if(!L)return;

    G.playing=(L.playing||[]).filter(function(id){return !!personOf(id);});G.seatPerson={};G.names={};
    Object.keys(L.seatPerson||{}).forEach(function(n){var p=personOf(L.seatPerson[n]);if(p&&+n<=G.players){G.seatPerson[n]=p.id;G.names[n]=p.name;}});
  });
};

/* 首夜登記身分 */
ACT.regRole=function(ds){UI.regRole=ds.r;render();};
ACT.regSeat=function(ds){mutate(function(G){
  var n=+ds.seat,steps=nightSteps(G,G.day),st=steps[Math.min(G.step,steps.length-1)],ids=regIds(G,st),role=UI.regRole,cur=G.seats[n];
  if(ids.indexOf(role)<0)return;

  if(remaining(G,role)>0)G.seats[n]=role;
});};

/* 警長競選 */
ACT.cand=function(ds){mutate(function(G){var n=+ds.seat,i=G.cand.indexOf(n);if(i>=0){G.cand.splice(i,1);if(G.sheriff===n)G.sheriff=null;}else G.cand.push(n);});};
function rollCandOrder(G){
  var c=G.cand.filter(function(n){return !isDead(G,n);});if(!c.length)return;
  G.sh.order={start:c[Math.floor(Math.random()*c.length)],dir:Math.random()<0.5?1:-1};
}
ACT.sSpeech=function(){mutate(function(G){G.sh.step='speech';G.sh.withdrawn=[];G.sh.uncontested=false;if(G.votes){delete G.votes.S;delete G.votes.S2;}if(G.pk)delete G.pk.S;rollCandOrder(G);});};

ACT.sWithdraw=function(){mutate(function(G){G.sh.step='withdraw';});};
ACT.sWd=function(ds){mutate(function(G){
  var n=+ds.seat,w=(G.sh.withdrawn||[]).slice(),i=w.indexOf(n);if(i>=0)w.splice(i,1);else w.push(n);G.sh.withdrawn=w;
});};
ACT.sUncontested=function(ds){mutate(function(G){var n=+ds.seat;G.sheriff=n;G.badgeLost=false;G.sh.status='elected';G.sh.uncontested=true;G.sheriffDone=true;G.stage=night(G,G.day).committed?'day':'dawn';});};
ACT.sVote=function(){mutate(function(G){G.sh.step='vote';UI.sBoom=false;});};
ACT.sElect=function(ds){mutate(function(G){var n=+ds.seat;if(G.sheriff===n){G.sheriff=null;G.sh.status='active';}else{G.sheriff=n;G.badgeLost=false;G.sh.status='elected';}});};
ACT.sNoWinner=function(){mutate(function(G){
  G.sheriff=null;G.badgeLost=true;G.sh.status='lost';
  if(G.sh.step==='withdraw'){G.sheriffDone=true;G.stage=night(G,G.day).committed?'day':'dawn';}else G.sh.step='vote';
});};
ACT.sNone=function(){mutate(function(G){G.sheriff=null;G.badgeLost=true;G.sh.status='lost';G.sheriffDone=true;G.stage=night(G,G.day).committed?'day':'dawn';});};
ACT.sBoom=function(){UI.sBoom=!UI.sBoom;render();};
ACT.sBoomPick=function(ds){
  var n=+ds.seat;UI.sBoom=false;
  mutate(function(G){
    var s=G.sh,d=G.day,rl=rules(G);
    G.deaths.push({seat:n,day:d,phase:'D',cause:'自爆'});
    s.booms=(s.booms||0)+1;s.boomSeats.push(n);s.boomSeat=n;s.boomDay=d;
    G.cand=G.cand.filter(function(x){return x!==n;});
    var lost=rl.boom==='single'||s.booms>=2;
    if(lost){G.sheriff=null;G.badgeLost=true;G.sheriffDone=true;s.status='lost';}
    else s.status='interrupted';
    var toDay=lost&&s.resumed;
    s.goNight=!toDay;
    if(!toDay&&night(G,d).committed){G.day=d+1;G.stage='night';G.step=0;s.goNight=false;}
    else G.stage='dawn';
  });
};
ACT.finishSheriff=function(){mutate(function(G){

  G.stage=night(G,G.day).committed?'day':'dawn';
});};

ACT.vtVoter=function(ds){
  var vt=UI.voteTarget;if(!vt||vt.key!==ds.key)return;
  mutate(function(G){G.votes=G.votes||{};var v=G.votes[ds.key]=G.votes[ds.key]||{},m=+ds.seat;if(v[m]===vt.seat)delete v[m];else v[m]=vt.seat;});

ACT.vtApplyGo=function(){var p=UI.pendingApply;UI.modal=null;UI.pendingApply=null;if(p)ACT.vtApply({key:p.key,seat:p.seat,force:true});else render();};
ACT.vtApply=function(ds){
  var G=APP.cur,n=+ds.seat;
  if(!ds.force){
    var rec=(G.votes&&G.votes[ds.key])||{},un=eligibleVoters(G,ds.key).filter(function(m){return rec[m]===undefined;});
    if(un.length){
      UI.pendingApply={key:ds.key,seat:ds.seat};
      openModal({type:'confirm',title:'還有 '+un.length+' 人沒記錄票型',msg:un.join('、')+' 號還沒記錄，結果可能會變。確定要採用「'+n+' 號'+(baseKeyOf(ds.key)==='S'?'當選警長':'放逐出局')+'」嗎？（取消可回去補記）',go:'vtApplyGo'});
      return;
    }
  }
  if(baseKeyOf(ds.key)==='S'){if(G.sheriff!==n)ACT.sElect({seat:n});return;}
  var dd=G.days[G.day]||{};if(dd.out===n&&dd.kind)return;
  ACT.voteSeat({seat:n});
};
ACT.vtTie=function(ds){if(baseKeyOf(ds.key)==='S')ACT.sNoWinner();else ACT.voteNone();};
function rollPk(pk){pk.start=pk.seats[Math.floor(Math.random()*pk.seats.length)];pk.dir=Math.random()<0.5?1:-1;}
ACT.vtPk=function(ds){

  if(v){var d=new Date(v);if(!isNaN(d))e.created=d.toISOString();}
  e.seqManual=(n!==''&&isFinite(+n)&&+n>0)?Math.floor(+n):null;
  if(t!==!!e.isTest){e.isTest=t;if(t)e.share=false;else if(e.share===false)e.share=true;}
  try{e.text=exportText(e);}catch(x){}
  e.savedAt=Date.now();
  var chg=renumberHistory();UI.modal=null;saveHistLocal();pushHistory(e);chg.forEach(function(x){if(x!==e)pushHistory(x);});render();
};
ACT.watchNew=function(){mutate(function(G){G.watchCode=genWatchCode();G.watchOn=true;});};
ACT.watchOff=function(){mutate(function(G){G.watchOn=false;});};
ACT.watchEnable=function(){mutate(function(G){G.watchOn=true;if(!G.watchCode)G.watchCode=genWatchCode();});};
ACT.histSort=function(ds){UI.histSort=ds.v;render();};
ACT.histExportAll=function(){saveFile('werewolf_history_all.json',JSON.stringify(APP.history,null,1),'application/json');};
ACT.toggleTest=function(){mutate(function(G){G.isTest=!G.isTest;});};

/* ================= 事件 ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  if(el.classList.contains('overlay')&&e.target!==el)return;
  if(el.disabled)return;
  if(ACT[a]){e.preventDefault();ACT[a](el.dataset,el);}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target||!e.target.id)return;
  if(e.target.id==='f-newname'){e.preventDefault();ACT.rosterAdd();}
  else if(e.target.id==='f-sitname'){e.preventDefault();ACT.sitNew();}
});
window.addEventListener('pagehide',persist);
if(window.FB)wireFB();else window.addEventListener('fb-boot',wireFB);
render();
})();
</script>
